<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fahs – VAT Inspection Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: dark command-center rail + light working canvas; content in cards on a 12px rhythm. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#f6f8f7; --line:#dfe6e3; --line-2:#cbd5d1;
  --ink:#0f1c1a; --ink-2:#44524f; --muted:#74827f;
  --brand:#0b6b5f; --brand-2:#0f8a7a; --brand-ink:#ffffff; --brand-soft:#e1f1ed; --gold:#a8792c; --gold-2:#e3b866;
  --rail:#0c201d; --rail-2:#12302b; --rail-ink:#d7e5e1; --rail-muted:#7e9a94; --rail-line:#1c3a35;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e3e2db; --axis:#c3c2b7;
  --good:#0ca30c; --good-ink:#0a6b23; --good-bg:#e2f4e6; --warn:#fab219; --warn-ink:#7a5200; --warn-bg:#fff2d2;
  --crit:#d03b3b; --crit-ink:#b42323; --crit-bg:#fbe5e4; --none-ink:#6b7875; --none-bg:#edf1f0;
  --input:#fffdf4; --input-line:#e5dcae;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(12,32,29,.05),0 4px 16px rgba(12,32,29,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1211; --surface:#111b19; --surface-2:#15211f; --line:#22312e; --line-2:#2e403c; --ink:#e6eeec; --ink-2:#b2c1bd; --muted:#7f8f8b;
  --brand:#2fb39c; --brand-2:#4cc9b1; --brand-ink:#04211c; --brand-soft:#113a33; --gold:#d6a957; --gold-2:#e3b866;
  --rail:#060d0c; --rail-2:#0f2420; --rail-ink:#cfe0db; --rail-muted:#6f8a84; --rail-line:#16302b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835;
  --good-ink:#4fd27f; --good-bg:#11301d; --warn-ink:#f2c14e; --warn-bg:#352a0e; --crit-ink:#ff8080; --crit-bg:#3a1a1a; --none-ink:#8d9a97; --none-bg:#1b2624;
  --input:#17201b; --input-line:#3a4632; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1211; --surface:#111b19; --surface-2:#15211f; --line:#22312e; --line-2:#2e403c; --ink:#e6eeec; --ink-2:#b2c1bd; --muted:#7f8f8b;
  --brand:#2fb39c; --brand-2:#4cc9b1; --brand-ink:#04211c; --brand-soft:#113a33; --gold:#d6a957; --gold-2:#e3b866;
  --rail:#060d0c; --rail-2:#0f2420; --rail-ink:#cfe0db; --rail-muted:#6f8a84; --rail-line:#16302b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835;
  --good-ink:#4fd27f; --good-bg:#11301d; --warn-ink:#f2c14e; --warn-bg:#352a0e; --crit-ink:#ff8080; --crit-bg:#3a1a1a; --none-ink:#8d9a97; --none-bg:#1b2624;
  --input:#17201b; --input-line:#3a4632; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
/* rail */
nav.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.logo{width:38px;height:38px;flex:none}
.wordmark{font:700 21px/1 var(--f-display);letter-spacing:.01em;color:#fff}
.tagline{font-size:11.5px;color:var(--rail-muted);margin-top:4px;line-height:1.3}
.entity{background:var(--rail-2);border:1px solid var(--rail-line);border-radius:10px;padding:10px 12px;margin:0 4px 10px}
.ename{font-weight:600;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evat{font:12px var(--f-mono);color:var(--rail-muted)}
.nav-group{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:14px 12px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--rail-ink);font:500 13.5px var(--f-body);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start}
.nav-btn:hover{background:var(--rail-2)}
.nav-btn[aria-current="true"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
[dir="rtl"] .nav-btn[aria-current="true"]{box-shadow:inset -3px 0 0 var(--gold-2)}
.nav-btn .ic{width:18px;height:18px;opacity:.85}
.nl{flex:1}
.badge{background:var(--crit);color:#fff;font:600 11px var(--f-mono);min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav-foot{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--rail-muted);padding:14px 10px 0;border-top:1px solid var(--rail-line)}
.nav-foot .ic{width:16px;height:16px;flex:none;margin-top:1px}
/* main */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
.tb-title{flex:1;min-width:0}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:22px 28px 64px;display:flex;flex-direction:column;gap:18px;max-width:1440px}
.lead{margin:0;color:var(--ink-2);max-width:80ch;font-size:14.5px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:30px;height:30px;color:var(--brand)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
/* buttons & chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--ink);font:inherit;padding:0;cursor:pointer;text-align:start}
.link:hover{color:var(--brand);text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 12.5px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .cnt{font:600 11px var(--f-mono);opacity:.75}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}.dotc.ok{background:var(--good)}.dotc.bad{background:var(--crit)}.dotc.none{background:var(--line-2)}
.chip-s{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--none-bg);color:var(--none-ink)}
.chip-s.ok{background:var(--good-bg);color:var(--good-ink)}.chip-s.warn{background:var(--warn-bg);color:var(--warn-ink)}.chip-s.bad{background:var(--crit-bg);color:var(--crit-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--none-bg);color:var(--none-ink)}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--good-bg);color:var(--good-ink)}.pill.bad{background:var(--crit-bg);color:var(--crit-ink)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.sev{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:5px;border:1px solid}
.sev.high{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-bg)}
.sev.medium{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-bg)}
.sev.low{color:var(--none-ink);border-color:var(--line-2);background:var(--none-bg)}
.sevrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* tiles & cards */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);text-align:start;font:inherit;color:inherit}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--brand)}
.t-lab{font-size:12.5px;color:var(--muted);font-weight:500}
.t-val{font:600 24px/1.1 var(--f-display);color:var(--ink)}
.t-val.big{font-size:34px}
.t-val small{font:500 13px var(--f-body);color:var(--muted)}
.t-sub{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile.hero{position:relative;overflow:hidden}
.tile.hero::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.tile.hero.ok::before{background:var(--good)}.tile.hero.warn::before{background:var(--warn)}.tile.hero.bad::before{background:var(--crit)}
.tile.okv .t-val{color:var(--good-ink)}.tile.badv .t-val{color:var(--crit-ink)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h h2{font:600 15.5px/1.3 var(--f-display);margin:0;flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:10px 14px;color:var(--ink)}
.banner .ic{color:var(--warn-ink)}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:var(--r);padding:14px 16px}
.callout.ok{border-inline-start-color:var(--good)}
.callout p{margin:4px 0 0;color:var(--ink-2);max-width:95ch}
.callout .ic{width:20px;height:20px;color:var(--good-ink);margin-top:2px}
.empty{display:flex;gap:8px;align-items:center;color:var(--muted);margin:0;padding:10px 4px}
.empty .ic{color:var(--good-ink)}
/* tables */
.frame{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tbl thead th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl th.n,.tbl td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.n{direction:ltr}
.tbl tr.total td{background:var(--surface-2);font-weight:600}
.tbl tr.sub th{background:var(--surface);text-align:start;color:var(--brand);font-size:12px;letter-spacing:.04em}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .neg{color:var(--crit-ink);font-weight:600}
.tbl td.calc{background:var(--surface-2)}
.tbl th.calc{color:var(--brand)}
.tbl td.flags{color:var(--crit-ink);font-size:12px;min-width:260px}
.tbl.edit td{padding:3px 4px}
.tbl input,.tbl select,.fld input,.fld select,.fld textarea{width:100%;min-width:90px;background:var(--input);border:1px solid var(--input-line);color:var(--ink);border-radius:6px;padding:5px 7px;font:13px var(--f-body)}
.tbl input.num,.fld input.num{text-align:right;font-family:var(--f-mono);direction:ltr}
.rowno{color:var(--muted);font:11px var(--f-mono);text-align:end}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 8px;border-radius:6px}
.del:hover{color:var(--crit-ink);background:var(--crit-bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tip-line{margin-top:-8px}
.boxno{font:600 12px var(--f-mono);color:var(--brand);white-space:nowrap}
.boxname{display:flex;flex-direction:column}.boxname .ar{font-size:12px;color:var(--muted)}
.h3{font:600 16px var(--f-display)}
/* heat matrix */
.heat td.h{width:40px;min-width:36px;text-align:center;padding:5px 2px;cursor:pointer}
.heat th.c{text-align:center}
.heat td:first-child{white-space:nowrap}
.cell{display:inline-flex;width:28px;height:24px;border-radius:6px;align-items:center;justify-content:center}
.cell .ic{width:14px;height:14px;stroke-width:2.6}
.cell.ok{background:var(--good-bg);color:var(--good-ink)}.cell.bad{background:var(--crit-bg);color:var(--crit-ink)}.cell.none{background:var(--none-bg);color:var(--line-2)}
/* forms */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.form-grid.four{grid-template-columns:repeat(3,minmax(0,220px))}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500;min-width:0}
.fld small{color:var(--muted);font-weight:400}
.fld.inline{flex-direction:row;align-items:center;gap:8px}.fld.inline input{width:auto;min-width:140px}
.drop{display:flex;gap:16px;align-items:center;border:2px dashed var(--line-2);border-radius:var(--r);padding:18px 20px;flex-wrap:wrap}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop p{margin:4px 0 0;color:var(--muted);font-size:13px}.drop>div{flex:1;min-width:220px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.steps li b::before{content:counter(st);display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:600 12px var(--f-mono);align-items:center;justify-content:center;margin-inline-end:8px}
.steps li span{color:var(--ink-2);font-size:12.5px}
/* charts */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--grid);stroke-width:1}.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--muted);font:11px var(--f-mono)}
.chart .mark{transition:opacity .15s}
.barlist{display:flex;flex-direction:column;gap:9px}
.bl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bl-track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bl-bar{display:block;height:100%;border-radius:0 4px 4px 0}
[dir="rtl"] .bl-bar{border-radius:4px 0 0 4px;margin-inline-start:auto;margin-left:auto}
.bl-val{min-width:90px;text-align:end;direction:ltr}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0 0;border-top:1px solid var(--line);font-size:13px}
.sum-row.good b{color:var(--good-ink)}.sum-row.tot{font-weight:600;font-size:14px}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:320px}
.bf{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px}
/* tests */
.tests{display:flex;flex-direction:column;gap:8px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.test.fail{border-inline-start:4px solid var(--crit)}.test.pass{border-inline-start:4px solid var(--good)}.test.na{border-inline-start:4px solid var(--line-2)}
.test-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:11px 14px;cursor:pointer;text-align:start;flex-wrap:wrap}
.test-h:hover{background:var(--surface-2)}
.st{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center}
.st .ic{width:14px;height:14px;stroke-width:2.6}
.st.fail{background:var(--crit-bg);color:var(--crit-ink)}.st.pass{background:var(--good-bg);color:var(--good-ink)}.st.na{background:var(--none-bg);color:var(--muted)}
.tid{color:var(--muted);font-size:12px}.tt{font-weight:600}.area{font-size:12px;color:var(--muted)}
.tm{min-width:80px;text-align:end;font-size:12.5px;color:var(--ink-2);direction:ltr}
.test-b{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
/* modal, toast, splash */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:65;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.modal p{margin-top:0}
.modal textarea{width:100%;height:180px;font:12px var(--f-mono);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.splash h2{font:600 22px var(--f-display);margin:0}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Arabic */
html[lang="ar"] body{font-family:var(--f-body)}
html[lang="ar"] .ar{display:none}
html[lang="ar"] .nav-group,html[lang="ar"] .tbl thead th{letter-spacing:0;text-transform:none}
/* responsive */
@media (max-width:1180px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
