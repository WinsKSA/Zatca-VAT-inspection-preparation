# Builds the Fahs mobile apps in the cloud (no Android Studio or Mac needed locally).
#   Android: an installable APK, published to the "app-latest" release (download link on app.html).
#   iOS:     a simulator build that proves the app compiles. Installing on iPhones needs an
#            Apple Developer account and signing; until then iPhone users install from Safari.
name: Mobile apps
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npm run assets -- --android
      - run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk fahs.apk
      - uses: actions/upload-artifact@v4
        with: { name: fahs-android, path: mobile/fahs.apk }
      - name: Publish to the app-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Fahs mobile app (latest)
          body: |
            Android: download **fahs.apk** below on your phone and open it (allow "install from this source" when asked).
            iPhone: open https://winsksa.github.io/Zatca-VAT-inspection-preparation/app.html in Safari and follow the steps.
          files: mobile/fahs.apk
          make_latest: true
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npm run assets -- --ios
      - run: npx cap sync ios
      - name: Build for the iOS simulator (unsigned)
        working-directory: mobile/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build || xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: cd ios/App/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/fahs-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with: { name: fahs-ios-simulator, path: fahs-ios-simulator.zip }
