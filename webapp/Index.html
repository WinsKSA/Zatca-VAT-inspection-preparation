<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fahs – VAT Inspection Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: dark command-center rail + light working canvas; content in cards on a 12px rhythm. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#f6f8f7; --line:#dfe6e3; --line-2:#cbd5d1;
  --ink:#0f1c1a; --ink-2:#44524f; --muted:#74827f;
  --brand:#0b6b5f; --brand-2:#0f8a7a; --brand-ink:#ffffff; --brand-soft:#e1f1ed; --gold:#a8792c; --gold-2:#e3b866;
  --rail:#0c201d; --rail-2:#12302b; --rail-ink:#d7e5e1; --rail-muted:#7e9a94; --rail-line:#1c3a35;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e3e2db; --axis:#c3c2b7;
  --good:#0ca30c; --good-ink:#0a6b23; --good-bg:#e2f4e6; --warn:#fab219; --warn-ink:#7a5200; --warn-bg:#fff2d2;
  --crit:#d03b3b; --crit-ink:#b42323; --crit-bg:#fbe5e4; --none-ink:#6b7875; --none-bg:#edf1f0;
  --input:#fffdf4; --input-line:#e5dcae;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(12,32,29,.05),0 4px 16px rgba(12,32,29,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1211; --surface:#111b19; --surface-2:#15211f; --line:#22312e; --line-2:#2e403c; --ink:#e6eeec; --ink-2:#b2c1bd; --muted:#7f8f8b;
  --brand:#2fb39c; --brand-2:#4cc9b1; --brand-ink:#04211c; --brand-soft:#113a33; --gold:#d6a957; --gold-2:#e3b866;
  --rail:#060d0c; --rail-2:#0f2420; --rail-ink:#cfe0db; --rail-muted:#6f8a84; --rail-line:#16302b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835;
  --good-ink:#4fd27f; --good-bg:#11301d; --warn-ink:#f2c14e; --warn-bg:#352a0e; --crit-ink:#ff8080; --crit-bg:#3a1a1a; --none-ink:#8d9a97; --none-bg:#1b2624;
  --input:#17201b; --input-line:#3a4632; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1211; --surface:#111b19; --surface-2:#15211f; --line:#22312e; --line-2:#2e403c; --ink:#e6eeec; --ink-2:#b2c1bd; --muted:#7f8f8b;
  --brand:#2fb39c; --brand-2:#4cc9b1; --brand-ink:#04211c; --brand-soft:#113a33; --gold:#d6a957; --gold-2:#e3b866;
  --rail:#060d0c; --rail-2:#0f2420; --rail-ink:#cfe0db; --rail-muted:#6f8a84; --rail-line:#16302b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835;
  --good-ink:#4fd27f; --good-bg:#11301d; --warn-ink:#f2c14e; --warn-bg:#352a0e; --crit-ink:#ff8080; --crit-bg:#3a1a1a; --none-ink:#8d9a97; --none-bg:#1b2624;
  --input:#17201b; --input-line:#3a4632; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
/* rail */
nav.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.logo{width:38px;height:38px;flex:none}
.wordmark{font:700 21px/1 var(--f-display);letter-spacing:.01em;color:#fff}
.tagline{font-size:11.5px;color:var(--rail-muted);margin-top:4px;line-height:1.3}
.entity{background:var(--rail-2);border:1px solid var(--rail-line);border-radius:10px;padding:10px 12px;margin:0 4px 10px}
.ename{font-weight:600;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evat{font:12px var(--f-mono);color:var(--rail-muted)}
.nav-group{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:14px 12px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--rail-ink);font:500 13.5px var(--f-body);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start}
.nav-btn:hover{background:var(--rail-2)}
.nav-btn[aria-current="true"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
[dir="rtl"] .nav-btn[aria-current="true"]{box-shadow:inset -3px 0 0 var(--gold-2)}
.nav-btn .ic{width:18px;height:18px;opacity:.85}
.nl{flex:1}
.badge{background:var(--crit);color:#fff;font:600 11px var(--f-mono);min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav-foot{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--rail-muted);padding:14px 10px 0;border-top:1px solid var(--rail-line)}
.nav-foot .ic{width:16px;height:16px;flex:none;margin-top:1px}
/* main */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
.tb-title{flex:1;min-width:0}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:22px 28px 64px;display:flex;flex-direction:column;gap:18px;max-width:1440px}
.lead{margin:0;color:var(--ink-2);max-width:80ch;font-size:14.5px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:30px;height:30px;color:var(--brand)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
/* buttons & chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--ink);font:inherit;padding:0;cursor:pointer;text-align:start}
.link:hover{color:var(--brand);text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 12.5px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .cnt{font:600 11px var(--f-mono);opacity:.75}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}.dotc.ok{background:var(--good)}.dotc.bad{background:var(--crit)}.dotc.none{background:var(--line-2)}
.chip-s{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--none-bg);color:var(--none-ink)}
.chip-s.ok{background:var(--good-bg);color:var(--good-ink)}.chip-s.warn{background:var(--warn-bg);color:var(--warn-ink)}.chip-s.bad{background:var(--crit-bg);color:var(--crit-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--none-bg);color:var(--none-ink)}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--good-bg);color:var(--good-ink)}.pill.bad{background:var(--crit-bg);color:var(--crit-ink)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.sev{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:5px;border:1px solid}
.sev.high{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-bg)}
.sev.medium{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-bg)}
.sev.low{color:var(--none-ink);border-color:var(--line-2);background:var(--none-bg)}
.sevrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* tiles & cards */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);text-align:start;font:inherit;color:inherit}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--brand)}
.t-lab{font-size:12.5px;color:var(--muted);font-weight:500}
.t-val{font:600 24px/1.1 var(--f-display);color:var(--ink)}
.t-val.big{font-size:34px}
.t-val small{font:500 13px var(--f-body);color:var(--muted)}
.t-sub{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile.hero{position:relative;overflow:hidden}
.tile.hero::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.tile.hero.ok::before{background:var(--good)}.tile.hero.warn::before{background:var(--warn)}.tile.hero.bad::before{background:var(--crit)}
.tile.okv .t-val{color:var(--good-ink)}.tile.badv .t-val{color:var(--crit-ink)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h h2{font:600 15.5px/1.3 var(--f-display);margin:0;flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:10px 14px;color:var(--ink)}
.banner .ic{color:var(--warn-ink)}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:var(--r);padding:14px 16px}
.callout.ok{border-inline-start-color:var(--good)}
.callout p{margin:4px 0 0;color:var(--ink-2);max-width:95ch}
.callout .ic{width:20px;height:20px;color:var(--good-ink);margin-top:2px}
.empty{display:flex;gap:8px;align-items:center;color:var(--muted);margin:0;padding:10px 4px}
.empty .ic{color:var(--good-ink)}
/* tables */
.frame{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tbl thead th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl th.n,.tbl td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.n{direction:ltr}
.tbl tr.total td{background:var(--surface-2);font-weight:600}
.tbl tr.sub th{background:var(--surface);text-align:start;color:var(--brand);font-size:12px;letter-spacing:.04em}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .neg{color:var(--crit-ink);font-weight:600}
.tbl td.calc{background:var(--surface-2)}
.tbl th.calc{color:var(--brand)}
.tbl td.flags{color:var(--crit-ink);font-size:12px;min-width:260px}
.tbl.edit td{padding:3px 4px}
.tbl input,.tbl select,.fld input,.fld select,.fld textarea{width:100%;min-width:90px;background:var(--input);border:1px solid var(--input-line);color:var(--ink);border-radius:6px;padding:5px 7px;font:13px var(--f-body)}
.tbl input.num,.fld input.num{text-align:right;font-family:var(--f-mono);direction:ltr}
.rowno{color:var(--muted);font:11px var(--f-mono);text-align:end}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 8px;border-radius:6px}
.del:hover{color:var(--crit-ink);background:var(--crit-bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tip-line{margin-top:-8px}
.boxno{font:600 12px var(--f-mono);color:var(--brand);white-space:nowrap}
.boxname{display:flex;flex-direction:column}.boxname .ar{font-size:12px;color:var(--muted)}
.h3{font:600 16px var(--f-display)}
/* heat matrix */
.heat td.h{width:40px;min-width:36px;text-align:center;padding:5px 2px;cursor:pointer}
.heat th.c{text-align:center}
.heat td:first-child{white-space:nowrap}
.cell{display:inline-flex;width:28px;height:24px;border-radius:6px;align-items:center;justify-content:center}
.cell .ic{width:14px;height:14px;stroke-width:2.6}
.cell.ok{background:var(--good-bg);color:var(--good-ink)}.cell.bad{background:var(--crit-bg);color:var(--crit-ink)}.cell.none{background:var(--none-bg);color:var(--line-2)}
/* forms */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.form-grid.four{grid-template-columns:repeat(3,minmax(0,220px))}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500;min-width:0}
.fld small{color:var(--muted);font-weight:400}
.fld.inline{flex-direction:row;align-items:center;gap:8px}.fld.inline input{width:auto;min-width:140px}
.drop{display:flex;gap:16px;align-items:center;border:2px dashed var(--line-2);border-radius:var(--r);padding:18px 20px;flex-wrap:wrap}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop p{margin:4px 0 0;color:var(--muted);font-size:13px}.drop>div{flex:1;min-width:220px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.steps li b::before{content:counter(st);display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:600 12px var(--f-mono);align-items:center;justify-content:center;margin-inline-end:8px}
.steps li span{color:var(--ink-2);font-size:12.5px}
/* charts */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--grid);stroke-width:1}.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--muted);font:11px var(--f-mono)}
.chart .mark{transition:opacity .15s}
.barlist{display:flex;flex-direction:column;gap:9px}
.bl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bl-track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bl-bar{display:block;height:100%;border-radius:0 4px 4px 0}
[dir="rtl"] .bl-bar{border-radius:4px 0 0 4px;margin-inline-start:auto;margin-left:auto}
.bl-val{min-width:90px;text-align:end;direction:ltr}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0 0;border-top:1px solid var(--line);font-size:13px}
.sum-row.good b{color:var(--good-ink)}.sum-row.tot{font-weight:600;font-size:14px}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:320px}
.bf{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px}
/* tests */
.tests{display:flex;flex-direction:column;gap:8px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.test.fail{border-inline-start:4px solid var(--crit)}.test.pass{border-inline-start:4px solid var(--good)}.test.na{border-inline-start:4px solid var(--line-2)}
.test-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:11px 14px;cursor:pointer;text-align:start;flex-wrap:wrap}
.test-h:hover{background:var(--surface-2)}
.st{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center}
.st .ic{width:14px;height:14px;stroke-width:2.6}
.st.fail{background:var(--crit-bg);color:var(--crit-ink)}.st.pass{background:var(--good-bg);color:var(--good-ink)}.st.na{background:var(--none-bg);color:var(--muted)}
.tid{color:var(--muted);font-size:12px}.tt{font-weight:600}.area{font-size:12px;color:var(--muted)}
.tm{min-width:80px;text-align:end;font-size:12.5px;color:var(--ink-2);direction:ltr}
.test-b{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
/* modal, toast, splash */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:65;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.modal p{margin-top:0}
.modal textarea{width:100%;height:180px;font:12px var(--f-mono);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.splash h2{font:600 22px var(--f-display);margin:0}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Arabic */
html[lang="ar"] body{font-family:var(--f-body)}
html[lang="ar"] .ar{display:none}
html[lang="ar"] .nav-group,html[lang="ar"] .tbl thead th{letter-spacing:0;text-transform:none}
/* responsive */
@media (max-width:1180px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}

function normDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==="number"&&v>20000&&v<80000)return iso(new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5));
  const s=String(v).trim();let m;
  if((m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(s)))return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if((m=/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s](\d{4})/.exec(s))){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)return `${m[3]}-${pad(i+1)}-${pad(m[1])}`}
  if(/^\d{5}$/.test(s))return normDate(+s);
  return s;
}

function cfg(){const s=S.setup;return{rate:num(s.rate)/100,tol:num(s.tol),lpp:num(s.lpp)/100,irp:num(s.irp)/100,asof:D(s.asof)||todayD(),init:s.init==="Yes",initEnd:D(s.initEnd),initCut:D(s.initCut)}}
function periods(){
  let fy=D(S.setup.fy)||D("2025-01-01"); fy=new Date(Date.UTC(fy.getUTCFullYear(),fy.getUTCMonth(),1));
  const n=S.setup.freq==="Quarterly"?4:12, mp=12/n, out=[];
  for(let i=0;i<n;i++){const st=addM(fy,i*mp), en=new Date(addM(fy,(i+1)*mp)-864e5), due=eom(addM(en,1));
    out.push({i,no:i+1,st,en,due,label:n===12?`${MON[st.getUTCMonth()]} ${st.getUTCFullYear()}`:`Q${i+1} ${st.getUTCFullYear()}`,short:n===12?MON[st.getUTCMonth()]:`Q${i+1}`,months:Array.from({length:mp},(_,k)=>i*mp+k)})}
  return out;
}
function monthLabels(){let fy=D(S.setup.fy)||D("2025-01-01");return Array.from({length:12},(_,m)=>{const d=addM(fy,m);return `${MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`})}
function periodOf(ps,s){const d=D(s);if(!d)return 0;const p=ps.find(p=>d>=p.st&&d<=p.en);return p?p.no:0}
function monthsLate(due,d){if(!due||!d||d<=due)return 0;return (d.getUTCFullYear()-due.getUTCFullYear())*12+d.getUTCMonth()-due.getUTCMonth()+(d.getUTCDate()>due.getUTCDate()?1:0)}
const normNo=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");

function salesCalc(r,ps,c){
  if(!r.date&&!r.no&&!r.net)return null;
  const p=periodOf(ps,r.date), net=num(r.net), vat=num(r.vat), exp=r.cat===SALES_CATS[0]?r2(net*c.rate):0, diff=r2(vat-exp), f=[];
  if(!p)f.push("Date outside audit periods");
  if(!r.cat)f.push("No VAT category");
  if(Math.abs(diff)>c.tol)f.push("VAT ≠ 15% × net");
  if(r.ctype===CUST_TYPES[0]&&!vatOk(r.cvat))f.push("Invalid or missing customer VAT no");
  if(r.fat!=="Yes")f.push("Not reported/cleared on FATOORA");
  if((r.cat===SALES_CATS[2]||r.cat===SALES_CATS[3])&&!String(r.ev||"").trim())f.push("Zero-rate/export evidence missing");
  if(r.type==="Credit Note"&&net>0)f.push("Credit note should be negative");
  if(r.type==="Simplified Tax Invoice"&&r.ctype===CUST_TYPES[0])f.push("Simplified invoice to VAT-registered B2B");
  if(r.cat&&!SALES_CATS.includes(r.cat))f.push("Unknown VAT category");
  return{p,net,vat,exp,diff,total:net+vat,flags:f};
}
function purCalc(r,ps,c,dup){
  if(!r.date&&!r.no&&!r.net)return null;
  const p=periodOf(ps,r.date), net=num(r.net), vat=num(r.vat), vatable=PUR_CATS.slice(0,3).includes(r.cat), blocked=/blocked/i.test(r.nature||"");
  const exp=vatable?r2(net*c.rate):0, diff=r2(vat-exp), claimed=r.claimed==="Yes"?vat:0;
  const defensible=(!dup&&r.claimed==="Yes"&&r.valid==="Yes"&&!blocked&&vatable&&(r.cat!==PUR_CATS[0]||vatOk(r.svat)))?vat:0;
  const f=[];
  if(!p)f.push("Date outside audit periods");
  if(!r.cat)f.push("No VAT category");
  if(dup)f.push("Duplicate supplier invoice");
  if(Math.abs(diff)>c.tol)f.push("VAT ≠ 15% × net");
  if(r.cat===PUR_CATS[0]&&!vatOk(r.svat))f.push("Invalid or missing supplier VAT no");
  if(r.claimed==="Yes"&&r.valid!=="Yes")f.push("VAT claimed without a valid tax invoice");
  if(r.claimed==="Yes"&&blocked)f.push("Blocked input VAT claimed");
  if(r.cat===PUR_CATS[1]&&!String(r.bayan||"").trim())f.push("Customs declaration no missing");
  if(r.cat===PUR_CATS[2]&&isSaudi(r.country))f.push("Reverse charge used for a local supplier");
  if(r.claimed==="Yes"&&!vatable&&r.cat)f.push("VAT claimed on a non-taxable category");
  if(r.country&&!isSaudi(r.country)&&net>0&&r.cat!==PUR_CATS[1]&&r.cat!==PUR_CATS[2])f.push("Foreign supplier without reverse charge");
  return{p,net,vat,exp,diff,total:net+vat,claimed,defensible,risk:r2(claimed-defensible),flags:f,dup};
}
function retCalc(r,c,p){
  const n=b=>num(r.b[b].a)+num(r.b[b].j), v=b=>num(r.b[b].v);
  const box6=[1,2,3,4,5].reduce((s,b)=>s+n(b),0), out=[1,2,3,4,5,9].reduce((s,b)=>s+v(b),0);
  const box12=[7,8,9,10,11].reduce((s,b)=>s+n(b),0), inp=[7,8,9,10,11].reduce((s,b)=>s+v(b),0);
  const box13=r2(out-inp), b14=num(r.b14), b15=num(r.b15), b16c=r2(box13+b14-b15);
  const entered=!!(r.filed||String(r.b16).trim()||BOX_IDS.some(b=>String(r.b[b].a).trim()||String(r.b[b].v).trim()));
  const arith=!entered?"none":(Math.abs(num(r.b16)-b16c)<=c.tol?"ok":"bad");
  const fd=D(r.filed); const late=!r.filed?"none":(fd<=p.due?"ok":"bad");
  return{n,v,box6,out,box12,inp,box13,b14,b15,b16:num(r.b16),b16c,entered,arith,late,lateDays:fd&&fd>p.due?daysBetween(p.due,fd):0,b14ok:Math.abs(b14)<=5000};
}
function tbSum(pred,months){let s=0;for(const r of S.tb){if(!pred(r))continue;for(const m of months)s+=num(r.m[m])}return s}
const BENFORD=[0,...Array.from({length:9},(_,i)=>Math.log10(1+1/(i+1)))];

    const b8=R.v(8), c8=sumP(p.no,"vat",r=>r.cat===PUR_CATS[1]), b9=R.v(9), c9=sumP(p.no,"vat",r=>r.cat===PUR_CATS[2]);
    return{p,ret,cl,df,rk,gl,d1:ret-cl,d2:ret-gl,s:st([ret-cl,ret-gl],[ret,cl,gl]),over:Math.max(0,ret-df),b8,c8,d8:b8-c8,b9,c9,d9:b9-c9}});

// ================================================================ exposure (two scenarios, no double counting)
function exposure(C){
  const c=C.c, rows=C.ps.map((p,i)=>{const o=C.outRec[i], n=C.inRec[i], v=C.vatRec[i];
    return{p,out:o.under,inp:n.over,latePay:v.latePen+v.unpaidPen,lateFile:v.late==="bad"&&C.rets[i].box13>0?r2(C.rets[i].box13*0.05):0,eligible:!!(c.initCut&&p.due<=c.initCut)}});
  // unexplained revenue beyond what period-level under-declaration already explains
  const extraRev=Math.max(0,r2(Math.max(0,C.rev.unexpl)*c.rate-rows.reduce((s,r)=>s+r.out,0)));
  if(extraRev>0){const last=[...rows].reverse().find(r=>C.rets[r.p.i].entered)||rows[rows.length-1];last.out+=extraRev}
  rows.forEach(r=>{r.tax=r2(r.out+r.inp);r.pen=r2(r.tax*c.irp);r.allPen=r2(r.pen+r.latePay+r.lateFile)});
  const sum=f=>r2(rows.reduce((s,r)=>s+r[f],0));
  const tax=sum("tax"), pen=sum("pen"), latePay=sum("latePay"), lateFile=sum("lateFile");
  const today=todayD(), active=c.init&&c.initEnd&&today<=c.initEnd;
  const waived=active?r2(rows.reduce((s,r)=>r.eligible?s+r.allPen:s,0)):0;
  const A=r2(tax+pen+latePay+lateFile), B=r2(A-waived);
  return{rows,tax,out:sum("out"),inp:sum("inp"),pen,latePay,lateFile,A,B,waived,active,daysLeft:c.initEnd?daysBetween(today,c.initEnd):null,extraRev};
}

function sampleItems(C){
  const pop=S.sample.pop==="purchases"?S.purchases.map((r,i)=>({r,x:C.pur[i],i,key:"p|"+i+"|"+r.no})):S.sales.map((r,i)=>({r,x:C.sales[i],i,key:"s|"+i+"|"+r.no}));
  const items=pop.filter(o=>o.x&&Math.abs(o.x.net)>0);const total=items.reduce((s,o)=>s+Math.abs(o.x.net),0);const n=Math.max(1,Math.min(items.length,Math.round(num(S.sample.size))||1));
  if(!items.length)return{items:[],total:0,interval:0,n:0};
  const interval=total/n, rand=rng(S.sample.seed||"1"), start=rand()*interval, picks=[];let cum=0,k=0;
  for(const o of items){const a=Math.abs(o.x.net);while(k<n&&start+k*interval<cum+a){if(picks[picks.length-1]!==o)picks.push(o);k++}cum+=a}
  return{items:picks,total,interval,n};
}

function columnChart(cats,series,{h=220,fmtv=fmt0,pct=false,id=""}={}){
  const W=680,H=h,padL=56,padR=12,padT=12,padB=28,iw=W-padL-padR,ih=H-padT-padB;
  const max=niceMax(Math.max(...series.flatMap(s=>s.values.map(v=>Math.max(0,v))),0)), y=v=>padT+ih-ih*Math.max(0,v)/max;
  const band=iw/cats.length, bars=series.filter(s=>s.type!=="line"), gw=band*0.66, bw=Math.max(3,Math.min(22,gw/Math.max(1,bars.length)-2));
  const ticks=[0,.25,.5,.75,1].map(f=>f*max);
  let g=ticks.map(t=>`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${padL-8}" y="${y(t)+4}" class="tick" text-anchor="end">${pct?(t*100).toFixed(0)+"%":fmtK(t)}</text>`).join("");
  g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" class="axis"/>`;
  cats.forEach((c,i)=>{const cx=padL+band*i+band/2;g+=`<text x="${cx}" y="${H-8}" class="tick" text-anchor="middle">${esc(c)}</text>`;
    const tot=bars.length*bw+(bars.length-1)*2;bars.forEach((s,k)=>{const v=s.values[i]||0,x=cx-tot/2+k*(bw+2),top=y(v),hgt=y(0)-top;
      if(hgt>0.5){const r=Math.min(4,bw/2,hgt);g+=`<path d="M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y(0)} Z" fill="var(--${s.c})" class="mark"/>`}
      g+=`<rect x="${x-1}" y="${padT}" width="${bw+2}" height="${ih}" fill="transparent" ${tipAttr(`${tr(c)} · ${tr(s.name)}: ${pct?(v*100).toFixed(1)+"%":fmt(v)}`)}/>`})});
  series.filter(s=>s.type==="line").forEach(s=>{const pts=s.values.map((v,i)=>[padL+band*i+band/2,y(v)]);
    g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--${s.c})" stroke-width="2"/>`;
    pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--${s.c})" stroke="var(--surface)" stroke-width="2"/><circle cx="${p[0]}" cy="${p[1]}" r="11" fill="transparent" ${tipAttr(`${tr(cats[i])} · ${tr(s.name)}: ${pct?(s.values[i]*100).toFixed(1)+"%":fmt(s.values[i])}`)}/>`})});
  return `${legend(series)}<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>tr(s.name)).join(", "))}" ${id?`id="${id}"`:""}>${g}</svg></div>`;
}

    ${t.hits.length?`<div class="frame"><table class="tbl" id="tt-${t.id}"><thead><tr><th>${esc(L("Reference","المرجع"))}</th><th>${esc(L("Date","التاريخ"))}</th><th>${esc(L("Party","الطرف"))}</th><th class="n">${esc(L("Amount","المبلغ"))}</th><th class="n">${esc(L("Tax at risk","الضريبة المعرضة"))}</th></tr></thead><tbody>${t.hits.slice(0,300).map(h=>`<tr><td class="mono">${esc(h.ref)}</td><td>${esc(showDate(h.date))}</td><td data-notr>${esc(h.party)}</td>${nc(h.amount)}${nc(h.tax)}</tr>`).join("")}</tbody></table></div>${t.hits.length>300?`<p class="note">${esc(L(`Showing 300 of ${t.hits.length}.`,`عرض 300 من ${t.hits.length}.`))}</p>`:""}<div class="row"><button class="btn sm" data-copy="tt-${t.id}">${esc("Copy table")}</button><button class="btn sm ghost" data-go="${t.go}">${esc(L("Open the data","فتح البيانات"))}</button></div>`:`<p class="empty">${icon("check")}${esc(t.status==="na"?L("Not enough data to run this test.","لا توجد بيانات كافية لتطبيق هذا الاختبار."):L("No exceptions found.","لا توجد استثناءات."))}</p>`}</div>`:""}</article>`}).join("")||`<p class="empty">${icon("check")}${esc(L("No failed tests.","لا توجد اختبارات فاشلة."))}</p>`}</div>`};

R.find=C=>{const E=C.exposure, fails=C.tests.filter(t=>t.status==="fail");

  return `<div class="callout ${E.active?"ok":""}">${icon(E.active?"check":"alert")}<div><b>${esc(L("ZATCA fines cancellation initiative","مبادرة إلغاء الغرامات والإعفاء من العقوبات المالية"))}</b><p>${esc(E.active?L(`Active until ${showDate(C.c.initEnd)} (${E.daysLeft} days left). It covers late registration, late filing, late payment and VAT return correction penalties for returns due on or before ${showDate(C.c.initCut)}, if all returns are filed and the principal tax is paid. It does not cover evasion penalties.`,`سارية حتى ${dAr(showDate(C.c.initEnd))} (متبقي ${E.daysLeft} يوم). تشمل غرامات التأخر في التسجيل والتقديم والسداد وتصحيح الإقرارات للإقرارات المستحقة حتى ${dAr(showDate(C.c.initCut))}، بشرط تقديم جميع الإقرارات وسداد أصل الضريبة. لا تشمل غرامات التهرب.`):L("Not active under your settings. Check ZATCA's announcements for the current position.","غير سارية حسب إعداداتك. راجع إعلانات الهيئة للوضع الحالي."))}</p></div></div>
  <div class="grid2">${card(L("Exposure by scenario (SAR)","التعرض حسب السيناريو (ريال)"),`<div class="frame"><table class="tbl" id="t-exp"><thead><tr><th></th><th class="n">${esc(L("A: no action","أ: دون إجراء"))}</th><th class="n">${esc(L("B: correct under the initiative","ب: التصحيح ضمن المبادرة"))}</th></tr></thead><tbody>
   ${row(L("Under-declared output VAT","ضريبة مخرجات غير مُقر بها"),E.out,E.out)}${row(L("Over-claimed input VAT","ضريبة مدخلات مخصومة بالزيادة"),E.inp,E.inp)}${row(L("Tax to pay","الضريبة المستحقة"),E.tax,E.tax,"total")}
   ${row(L("Incorrect-return penalty (50%)","غرامة الإقرار الخاطئ (50%)"),E.pen,E.pen-E.rows.filter(r=>r.eligible).reduce((s,r)=>s+r.pen,0)*(E.active?1:0))}${row(L("Late payment penalties","غرامات التأخر في السداد"),E.latePay,E.latePay-E.rows.filter(r=>r.eligible).reduce((s,r)=>s+r.latePay,0)*(E.active?1:0))}${row(L("Late filing penalty (minimum 5%)","غرامة التأخر في التقديم (5% كحد أدنى)"),E.lateFile,E.lateFile-E.rows.filter(r=>r.eligible).reduce((s,r)=>s+r.lateFile,0)*(E.active?1:0))}
   ${row(L("Total","الإجمالي"),E.A,E.B,"total")}</tbody></table></div><p class="note">${esc(L("Output exposure takes the higher of under-declared VAT and unexplained revenue × rate, so one error is never counted twice. Late filing can reach 25%; 5% is shown.","يؤخذ تعرض المخرجات بالأعلى بين الضريبة غير المُقر بها والإيرادات غير المفسرة × النسبة، فلا يُحتسب الخطأ مرتين. قد تصل غرامة التأخر في التقديم إلى 25%، والمعروض 5%."))}</p><div class="row"><button class="btn sm" data-copy="t-exp">${esc("Copy table")}</button></div>`)}
   ${card(L("Exposure by period (SAR)","التعرض حسب الفترة (ريال)"),(()=>{const rs=E.rows.filter(r=>r.tax||r.allPen);return rs.length?`<div class="frame"><table class="tbl"><thead><tr><th>${esc("Period")}</th><th class="n">${esc(L("Tax","الضريبة"))}</th><th class="n">${esc(L("Penalties","الغرامات"))}</th><th>${esc(L("Initiative","المبادرة"))}</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.tax)}${nc(r.allPen)}<td>${r.eligible&&E.active?pill("ok",L("Eligible","مؤهلة")):pill("none",L("Not eligible","غير مؤهلة"))}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">${icon("check")}${esc(L("No exposure in any period.","لا يوجد تعرض في أي فترة."))}</p>`})())}</div>
  ${card(L("Findings register","سجل الملاحظات"),fails.length?`<div class="frame"><table class="tbl edit" id="t-find"><thead><tr><th>ID</th><th>${esc(L("Finding","الملاحظة"))}</th><th>${esc(L("Severity","الخطورة"))}</th><th class="n">${esc(L("Items","البنود"))}</th><th class="n">${esc(L("Tax at risk","الضريبة المعرضة"))}</th><th>${esc(L("Decision","القرار"))}</th><th>${esc(L("Explanation for ZATCA","التفسير للهيئة"))}</th></tr></thead><tbody>
   ${fails.map(t=>{const d=S.decisions[t.id]||{};return `<tr><td class="mono"><button class="link" data-test="${t.id}">${t.id}</button></td><td style="min-width:220px">${esc(t.title)}</td><td>${sevPill(t.sev)}</td><td class="n">${t.count}</td>${nc(t.tax)}<td><select data-dec="${t.id}" data-f="d">${DECISIONS.map(o=>`<option value="${o}"${o===(d.d||"")?" selected":""}>${esc(LANG==="ar"?DEC_AR[o]:(o||"—"))}</option>`).join("")}</select></td><td><input data-dec="${t.id}" data-f="n" value="${esc(d.n||"")}" style="min-width:240px" placeholder="${esc(L("Why, and what evidence supports it","السبب، وما المستندات المؤيدة"))}"></td></tr>`}).join("")}</tbody></table></div>
   <div class="row"><button class="btn sm" data-copy="t-find">${esc("Copy table")}</button><span class="note">${esc(L(`${fails.filter(t=>(S.decisions[t.id]||{}).d).length} of ${fails.length} findings have a decision.`,`${fails.filter(t=>(S.decisions[t.id]||{}).d).length} من ${fails.length} ملاحظة لها قرار.`))}</span></div>`:`<p class="empty">${icon("check")}${esc(L("No findings.","لا توجد ملاحظات."))}</p>`)}`};

// ================================================================ sampling
R.samp=C=>{const sm=sampleItems(C), s=S.sample, it=sm.items;const vs=it.map(o=>S.vouch[o.key]||{s:"Not tested",n:""});

  return `<p class="lead">${esc(L("Monetary-unit sampling: larger invoices are more likely to be picked. Use it to vouch invoices to source documents before ZATCA does. The same seed always gives the same sample.","العينة بالوحدة النقدية: الفواتير الأكبر أكثر احتمالاً للاختيار. استخدمها لمطابقة الفواتير مع مستنداتها قبل الهيئة. نفس الرقم الأولي يعطي نفس العينة دائماً."))}</p>
  ${card("",`<div class="form-grid four"><label class="fld"><span>${esc(L("Population","المجتمع"))}</span><select id="s-pop"><option value="sales"${s.pop!=="purchases"?" selected":""}>${esc("Sales register")}</option><option value="purchases"${s.pop==="purchases"?" selected":""}>${esc("Purchase register")}</option></select></label><label class="fld"><span>${esc(L("Sample size","حجم العينة"))}</span><input id="s-size" inputmode="numeric" value="${esc(s.size)}"></label><label class="fld"><span>${esc(L("Seed","الرقم الأولي"))}</span><input id="s-seed" value="${esc(s.seed)}"></label></div>`)}
  <div class="tiles four">${tile(L("Population value (SAR)","قيمة المجتمع (ريال)"),`<span class="num">${fmt0(sm.total)}</span>`)}${tile(L("Sampling interval","فترة المعاينة"),`<span class="num">${fmt0(sm.interval)}</span>`)}${tile(L("Tested","تم فحصها"),`${tested} / ${it.length}`)}${tile(L("Exceptions","الاستثناءات"),exc,"",exc?"badv":"")}</div>
  ${card(L("Sample","العينة"),it.length?`<div class="frame"><table class="tbl edit" id="t-samp"><thead><tr><th>#</th><th>${esc(L("Reference","المرجع"))}</th><th>${esc(L("Date","التاريخ"))}</th><th>${esc(L("Party","الطرف"))}</th><th class="n">${esc(L("Net (SAR)","الصافي (ريال)"))}</th><th class="n">${esc(L("VAT (SAR)","الضريبة (ريال)"))}</th><th>${esc(L("Result","النتيجة"))}</th><th>${esc("Notes")}</th></tr></thead><tbody>
   ${it.map((o,k)=>{const v=S.vouch[o.key]||{s:"Not tested",n:""};return `<tr><td class="rowno">${k+1}</td><td class="mono">${esc(o.r.no)}</td><td>${esc(showDate(o.r.date))}</td><td data-notr>${esc(o.r.cust||o.r.sup||"")}</td>${nc(o.x.net)}${nc(o.x.vat)}<td><select data-vk="${esc(o.key)}" data-f="s">${VOUCH.map(x=>`<option value="${x}"${x===v.s?" selected":""}>${esc(L(x,{"Not tested":"لم يُفحص","Agreed":"مطابق","Exception":"استثناء"}[x]))}</option>`).join("")}</select></td><td><input data-vk="${esc(o.key)}" data-f="n" value="${esc(v.n)}" style="min-width:200px"></td></tr>`}).join("")}</tbody></table></div><div class="row"><button class="btn sm" data-copy="t-samp">${esc("Copy table")}</button></div>`:`<p class="empty">${esc(L("No invoices in this register yet.","لا توجد فواتير في هذا السجل بعد."))}</p>`)}`};

  document.querySelectorAll("[data-vk]").forEach(el=>{const h=()=>{const k=el.dataset.vk;S.vouch[k]=S.vouch[k]||{s:"Not tested",n:""};S.vouch[k][el.dataset.f]=el.value;save()};el.addEventListener("input",h);el.addEventListener("change",()=>{h();if(el.dataset.f==="s")render()})})};

 ${card(L("Document checklist","قائمة المستندات"),`<div class="frame"><table class="tbl edit" id="t-chk"><thead><tr><th>#</th><th>${esc("Area")}</th><th>${esc("Document or analysis")}</th><th>${esc("Prepared in this app")}</th><th>${esc("Status")}</th><th>${esc("Owner")}</th><th>${esc("File reference")}</th><th>${esc("Notes")}</th></tr></thead><tbody>

// ================================================================ methodology
R.method=C=>{const firms=[["KPMG","AVA / Tax Intelligence Solution",L("Tests the whole invoice population, predicts mis-booked invoices with machine learning, then an expert validates every hit.","يختبر جميع الفواتير، ويتنبأ بالفواتير المسجلة خطأً بالتعلم الآلي، ثم يتحقق خبير من كل نتيجة."),L("100% testing + human decision on every finding","اختبار 100% + قرار بشري لكل ملاحظة")],
  ["Deloitte","Global VAT/GST Radar · myInsight",L("Predefined checks and balances on VAT data, one dashboard, and an issue log with management reporting.","فحوصات محددة مسبقاً على بيانات الضريبة، ولوحة واحدة، وسجل ملاحظات مع تقارير للإدارة."),L("Numbered test library + findings register","مكتبة اختبارات مرقمة + سجل ملاحظات")],
  ["EY","Global VAT Reporting Tool",L("Uploads data from many systems, parameter tests, anomaly detection, tax calendar and an audit trail for returns.","رفع البيانات من عدة أنظمة، واختبارات معيارية، وكشف الأنماط غير الطبيعية، وتقويم ضريبي، وسجل تدقيق للإقرارات."),L("Data hub, anomaly analytics, deadlines, audit log","مركز بيانات، وتحليلات الأنماط، والمواعيد، وسجل التدقيق")],
  ["PwC","Indirect Tax Edge · VAT Data Check",L("Controls testing over 100% of transactions with 200+ compliance and data-quality checks.","اختبار الضوابط على 100% من المعاملات بأكثر من 200 فحص للالتزام وجودة البيانات."),L("Data-quality tests separated from tax tests","فصل اختبارات جودة البيانات عن الاختبارات الضريبية")],
  ["BDO","ONESOURCE Fast VAT (KSA/UAE)",L("Automated return preparation and periodic VAT health checks for GCC clients.","إعداد آلي للإقرارات وفحوصات دورية لسلامة الضريبة لعملاء الخليج."),L("Return-level controls and tie-outs","ضوابط على مستوى الإقرار ومطابقاته")],

    <tr class="total"><td class="boxno">Box 16</td><td><span>${esc("Net VAT due (or claimed)")}</span> · <span>${esc("as filed")}</span></td><td colspan="2" class="n" id="t16c"></td><td><input class="num" inputmode="decimal" data-top="b16" value="${esc(r.b16)}" aria-label="Box 16 as filed"></td></tr></tbody></table></div>
   <p class="note">${esc("VAT on reverse-charge imports (Box 9) counts as both output and input VAT on the return, so it is added to total output VAT here. Check this against your filed return.")}</p></section>
  ${card("All periods",`<div id="retsum"></div>`,`<button class="btn sm" data-copy="t-retsum">${esc("Copy table")}</button>`)}`};
function retSummary(C){return `<div class="frame"><table class="tbl" id="t-retsum"><thead><tr><th>${esc("Period")}</th><th>${esc("Filed")}</th><th class="n">${esc("Total sales")}</th><th class="n">${esc("Output VAT")}</th><th class="n">${esc("Total purchases")}</th><th class="n">${esc("Input VAT")}</th><th class="n">Box 13</th><th class="n">${esc("Box 16 recalculated")}</th><th class="n">${esc("Box 16 filed")}</th><th>${esc("Arithmetic")}</th><th>${esc("On time")}</th><th>Box 14</th></tr></thead><tbody>
  ${C.ps.map((p,i)=>{const X=C.rets[i];return `<tr><td>${esc(p.label)}</td><td>${esc(showDate(S.returns[i].filed))}</td>${nc(X.box6)}${nc(X.out)}${nc(X.box12)}${nc(X.inp)}${nc(X.box13)}${nc(X.b16c)}${nc(X.b16)}<td>${X.arith==="ok"?pill("ok","Agrees"):X.arith==="bad"?pill("bad","Filed ≠ recalculated"):pill("none","Not entered")}</td><td>${X.late==="ok"?pill("ok","On time"):X.late==="bad"?pill("bad",L(`${X.lateDays} days late`,`متأخر ${X.lateDays} يوم`)):pill("none","—")}</td><td>${X.b14ok?pill("ok","✓"):pill("bad","Over 5,000")}</td></tr>`}).join("")}
  <tr class="total"><td>${esc("Year")}</td><td></td>${["box6","out","box12","inp","box13","b16c","b16"].map(f=>nc(C.rets.reduce((s,x)=>s+x[f],0))).join("")}<td colspan="3"></td></tr></tbody></table></div>`}
L("Agrees","مطابق");L("Filed ≠ recalculated","المقدم ≠ المعاد احتسابه");L("On time","في الموعد");L("Over 5,000","يتجاوز 5,000");L("Not entered","لم يُدخل");
AFTER.ret=C=>{const k=Math.min(UI.ret.p,C.ps.length-1);
  const refresh=()=>{const C2=compute(),X=C2.rets[k];$("#t6a").textContent=fmt(X.box6);$("#t6v").textContent=fmt([1,2,3,4,5].reduce((s,b)=>s+X.v(b),0));$("#t12a").textContent=fmt(X.box12);$("#t12v").textContent=fmt(X.inp);
    $("#t13").textContent=fmt(X.box13);$("#t16c").innerHTML=`${esc(L("Recalculated","بعد إعادة الاحتساب"))}: ${fmt(X.b16c)} ${X.arith==="ok"?pill("ok","✓"):X.arith==="bad"?pill("bad",L("differs","مختلف")):""}`;$("#b14chk").innerHTML=X.b14ok?"":pill("bad","over limit");$("#retsum").innerHTML=retSummary(C2);renderNav(C2)};
  refresh();document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{UI.ret.p=+b.dataset.rp;render()});
  const form=document.querySelector(".form");
  form.addEventListener("input",e=>{const el=e.target,r=S.returns[k];if(el.dataset.b)r.b[el.dataset.b][el.dataset.f]=el.value;else if(el.dataset.top)r[el.dataset.top]=el.value;else return;S.example=false;save();refresh()});
  form.addEventListener("paste",e=>{const el=e.target;if(!el.dataset.b)return;const t=e.clipboardData.getData("text");if(!/[\t\n]/.test(t.trim()))return;e.preventDefault();const lines=t.replace(/\r/g,"").trim().split("\n").map(l=>l.split("\t"));
    const fields=["a","j","v"],bi=BOX_IDS.indexOf(+el.dataset.b),fi=fields.indexOf(el.dataset.f);lines.forEach((cells,ri)=>{const b=BOX_IDS[bi+ri];if(!b)return;cells.forEach((v,ci)=>{const f=fields[fi+ci];if(f)S.returns[k].b[b][f]=v===""?"":String(num(v))})});save();render()})};

// ================================================================ reconciliations
R.rsales=C=>`<p class="lead">${esc("For each box: what you declared, what you invoiced, and what you booked in the ledger. ZATCA usually starts here.")}</p>`+C.salesRec.map(x=>{const t=x.rows.reduce((a,r)=>({ret:a.ret+r.ret,reg:a.reg+r.reg,tb:a.tb+r.tb}),{ret:0,reg:0,tb:0}),id="t-rs"+x.b,bad=x.rows.filter(r=>r.s==="bad").length;
 return card(`Box ${x.b} · ${x.cat.replace(/ \(Box \d\)/,"")}`,`<div class="frame"><table class="tbl" id="${id}"><thead><tr><th>${esc("Period")}</th><th class="n">${esc("VAT return")}</th><th class="n">${esc("Sales register")}</th><th class="n">${esc("Trial balance")}</th><th class="n">${esc("Return − register")}</th><th class="n">${esc("Return − TB")}</th><th>${esc("Status")}</th></tr></thead><tbody>
 ${x.rows.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.ret)}${nc(r.reg)}${nc(r.tb)}${dc(r.d1,C.c.tol)}${dc(r.d2,C.c.tol)}<td>${sp(r.s)}</td></tr>`).join("")}
 <tr class="total"><td>${esc("Year")}</td>${nc(t.ret)}${nc(t.reg)}${nc(t.tb)}${dc(t.ret-t.reg,C.c.tol)}${dc(t.ret-t.tb,C.c.tol)}<td></td></tr></tbody></table></div>`,`${bad?pill("bad",L(`${bad} periods`,`${bad} فترة`)):""}<button class="btn sm" data-copy="${id}">${esc("Copy table")}</button>`)}).join("");
R.rrev=C=>{const v=C.rev;return `<p class="lead">${esc("Revenue in the financial statements against total sales declared for the year. ZATCA treats any unexplained excess as undeclared taxable sales.")}</p>
 <div class="grid2">${card("",`<div class="frame"><table class="tbl" id="t-rev"><tbody><tr><td>${esc("Total revenue per trial balance (FS class = Revenue)")}</td>${nc(v.tbRev)}</tr><tr><td>${esc("Less: revenue mapped as out of scope / other income")}</td>${nc(-v.oos)}</tr><tr class="total"><td>${esc("Revenue subject to VAT reporting")}</td>${nc(v.subj)}</tr><tr><td>${esc("Total sales per VAT returns (Box 6, full year)")}</td>${nc(v.retSales)}</tr><tr class="total"><td>${esc("Difference before reconciling items")}</td>${dc(v.rdiff,C.c.tol)}</tr></tbody></table></div>`)}
 <div class="tile hero ${Math.abs(v.unexpl)>C.c.tol?"bad":"ok"}"><span class="t-lab">${esc("Unexplained difference")}</span><span class="t-val big num" id="unexpl">${fmt(v.unexpl)}</span><span class="t-sub">${esc(Math.abs(v.unexpl)>C.c.tol?"Explain or correct before submitting":"Fully reconciled")}</span></div></div>
 ${card("Explained reconciling items",`<p class="note">${esc("Enter each item with the sign that reduces the difference.")}</p><div class="frame"><table class="tbl edit"><thead><tr><th>${esc("Description")}</th><th class="n">${esc("Amount (SAR)")}</th><th></th></tr></thead><tbody>
 ${S.recItems.map((x,i)=>`<tr><td><input class="ri" data-i="${i}" data-f="d" value="${esc(x.d)}" style="min-width:260px"></td><td><input class="ri num" data-i="${i}" data-f="a" inputmode="decimal" value="${esc(x.a)}"></td><td><button class="del" data-ri="${i}" aria-label="Delete item">×</button></td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn sm" id="addri">${esc("Add item")}</button></div>`)}`};
AFTER.rrev=()=>{document.querySelectorAll(".ri").forEach(el=>el.addEventListener("input",()=>{S.recItems[+el.dataset.i][el.dataset.f]=el.value;save();const C=compute();$("#unexpl").textContent=fmt(C.rev.unexpl);renderNav(C)}));
 document.querySelectorAll("[data-ri]").forEach(b=>b.onclick=()=>{S.recItems.splice(+b.dataset.ri,1);save();render()});$("#addri").onclick=()=>{S.recItems.push({d:"",a:""});save();render()}};
const activeIdx=C=>{const a=C.ps.filter((p,i)=>C.rets[i].entered||C.outRec[i].gl||C.inRec[i].gl||C.outRec[i].reg);return(a.length?a:C.ps.slice(0,3))};
R.rout=C=>{const T=f=>C.outRec.reduce((s,x)=>s+x[f],0),A=activeIdx(C);return `<p class="lead">${esc("Output VAT declared against invoices, the ledger and a 15% recomputation. Box 2 VAT is borne by the State and is left out of the recomputation.")}</p>
 ${card(L("Declared vs invoiced vs ledger","المُقر به مقابل الفواتير مقابل الدفاتر"),columnChart(A.map(p=>p.short),[{name:L("Declared in return","المُقر بها في الإقرار"),c:"s1",values:A.map(p=>C.outRec[p.i].ret)},{name:L("Invoiced (register)","الفواتير (السجل)"),c:"s3",values:A.map(p=>C.outRec[p.i].reg)},{name:L("Booked in ledger","المسجلة في الدفاتر"),c:"s2",values:A.map(p=>C.outRec[p.i].gl)}]))}
 ${card("",`<div class="frame"><table class="tbl" id="t-out"><thead><tr><th>${esc("Period")}</th><th class="n">${esc("Return (incl. RCM)")}</th><th class="n">${esc("Register sales VAT")}</th><th class="n">${esc("Register RCM VAT")}</th><th class="n">${esc("15% × (Box 1 + Box 9)")}</th><th class="n">${esc("GL output VAT")}</th><th class="n">${esc("Return − register")}</th><th class="n">${esc("Return − 15%")}</th><th class="n">${esc("Return − GL")}</th><th>${esc("Status")}</th><th class="n">${esc("Possible under-declaration")}</th></tr></thead><tbody>
 ${C.outRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.ret)}${nc(r.rs)}${nc(r.rr)}${nc(r.rc)}${nc(r.gl)}${dc(r.d1,C.c.tol)}${dc(r.d2,C.c.tol)}${dc(r.d3,C.c.tol)}<td>${sp(r.s)}</td>${nc(r.under,r.under>C.c.tol)}</tr>`).join("")}
 <tr class="total"><td>${esc("Year")}</td>${["ret","rs","rr","rc","gl","d1","d2","d3"].map(f=>nc(T(f))).join("")}<td></td>${nc(T("under"),T("under")>C.c.tol)}</tr></tbody></table></div>`,"",)}<div class="row"><button class="btn sm" data-copy="t-out">${esc("Copy table")}</button></div>`};
R.rin=C=>{const T=f=>C.inRec.reduce((s,x)=>s+x[f],0),A=activeIdx(C);return `<p class="lead">${esc("Input VAT claimed against the register and the ledger, and the part ZATCA is likely to disallow (no valid invoice, blocked expense, invalid supplier VAT number).")}</p>
 ${card(L("Claimed vs defensible vs ledger","المخصوم مقابل القابل للدفاع مقابل الدفاتر"),columnChart(A.map(p=>p.short),[{name:L("Claimed in return","المخصومة في الإقرار"),c:"s1",values:A.map(p=>C.inRec[p.i].ret)},{name:L("Defensible","القابلة للدفاع عنها"),c:"s3",values:A.map(p=>C.inRec[p.i].df)},{name:L("Booked in ledger","المسجلة في الدفاتر"),c:"s2",values:A.map(p=>C.inRec[p.i].gl)}]))}
 ${card("",`<div class="frame"><table class="tbl" id="t-in"><thead><tr><th>${esc("Period")}</th><th class="n">${esc("Return (Box 12)")}</th><th class="n">${esc("Register claimed")}</th><th class="n">${esc("Defensible")}</th><th class="n">${esc("At risk")}</th><th class="n">${esc("GL input VAT")}</th><th class="n">${esc("Return − register")}</th><th class="n">${esc("Return − GL")}</th><th>${esc("Status")}</th><th class="n">${esc("Possible over-claim")}</th></tr></thead><tbody>
 ${C.inRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.ret)}${nc(r.cl)}${nc(r.df)}${nc(r.rk,r.rk>0)}${nc(r.gl)}${dc(r.d1,C.c.tol)}${dc(r.d2,C.c.tol)}<td>${sp(r.s)}</td>${nc(r.over,r.over>C.c.tol)}</tr>`).join("")}
 <tr class="total"><td>${esc("Year")}</td>${["ret","cl","df","rk","gl","d1","d2"].map(f=>nc(T(f))).join("")}<td></td>${nc(T("over"),T("over")>C.c.tol)}</tr></tbody></table></div><div class="row"><button class="btn sm" data-copy="t-in">${esc("Copy table")}</button></div>`)}
 ${card("Imports: Box 8 and Box 9",`<div class="frame"><table class="tbl" id="t-imp"><thead><tr><th>${esc("Period")}</th><th class="n">${esc("Box 8 VAT (return)")}</th><th class="n">${esc("Customs VAT (register)")}</th><th class="n">${esc("Difference")}</th><th class="n">${esc("Box 9 VAT (return)")}</th><th class="n">${esc("RCM VAT (register)")}</th><th class="n">${esc("Difference")}</th></tr></thead><tbody>
 ${C.inRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.b8)}${nc(r.c8)}${dc(r.d8,C.c.tol)}${nc(r.b9)}${nc(r.c9)}${dc(r.d9,C.c.tol)}</tr>`).join("")}</tbody></table></div><p class="note">${esc("Also match Box 8 to ZATCA's customs import data. Customs VAT is deductible only when your company is the importer of record on the Bayan.")}</p>`)}`};
R.rvat=C=>{const T=f=>C.vatRec.reduce((s,x)=>s+x[f],0);return `<p class="lead">${esc(`Proves the ledger VAT liability equals returns filed less payments made, and estimates late-payment penalties up to ${showDate(S.setup.asof)}.`)}</p>
 <div class="tiles four">${tile("Opening VAT liability per ledger:".replace(":",""),`<span class="num">${fmt(C.openLiab)}</span>`)}${tile(L("Paid to ZATCA","المسدد للهيئة"),`<span class="num">${fmt(T("paid"))}</span>`)}${tile(L("Still unpaid","غير مسدد"),`<span class="num">${fmt(Math.max(0,T("outst")))}</span>`,"",T("outst")>C.c.tol?"badv":"")}${tile(L("Late payment penalties","غرامات التأخر في السداد"),`<span class="num">${fmt(T("latePen")+T("unpaidPen"))}</span>`)}</div>
 ${card("",`<div class="frame"><table class="tbl" id="t-vat"><thead><tr><th>${esc("Period")}</th><th class="n">${esc("Net VAT (Box 13 + 14)")}</th><th class="n">${esc("Box 16 filed")}</th><th class="n">${esc("Paid / (refunded)")}</th><th class="n">${esc("Outstanding")}</th><th>${esc("Due")}</th><th>${esc("Filed")}</th><th class="n">${esc("Penalty: paid late")}</th><th class="n">${esc("Penalty: still unpaid")}</th><th class="n">${esc("GL liability")}</th><th class="n">${esc("Expected liability")}</th><th class="n">${esc("Difference")}</th><th>${esc("Status")}</th></tr></thead><tbody>
 ${C.vatRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.net)}${nc(r.b16)}${nc(r.paid)}${nc(r.outst,r.outst>C.c.tol)}<td>${esc(showDate(r.p.due))}</td><td>${r.late==="ok"?pill("ok","✓"):r.late==="bad"?pill("bad",L(`${r.lateDays} days late`,`متأخر ${r.lateDays} يوم`)):pill("none","—")}</td>${nc(r.latePen,r.latePen>0)}${nc(r.unpaidPen,r.unpaidPen>0)}${nc(r.gl)}${nc(r.exp)}${dc(r.diff,C.c.tol)}<td>${r.s==="ok"?pill("ok","Agrees"):r.s==="bad"?pill("bad","Investigate"):r.carried?pill("warn",L("Earlier difference carried forward","فرق سابق مُرحّل")):pill("none","No activity")}</td></tr>`).join("")}
 <tr class="total"><td>${esc("Year")}</td>${["net","b16","paid","outst"].map(f=>nc(T(f))).join("")}<td></td><td></td>${nc(T("latePen"))}${nc(T("unpaidPen"))}<td colspan="4"></td></tr></tbody></table></div><p class="note">${esc("Expected liability = opening liability + cumulative (Box 13 + Box 14) − payments dated on or before period end. Late filing (5% to 25% of the tax) and incorrect return (50% of the difference) penalties may also apply.")}</p><div class="row"><button class="btn sm" data-copy="t-vat">${esc("Copy table")}</button></div>`)}`};
L("Paid to ZATCA","المسدد للهيئة");L("Opening VAT liability per ledger","التزام الضريبة الافتتاحي حسب الدفاتر");

window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v.id===h))go(h)});
applyLang();$("#nav").setAttribute("aria-label",tr("Sections"));langObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
if(REMOTE)loadRemote();render();

</script>
