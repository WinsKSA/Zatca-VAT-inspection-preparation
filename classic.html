<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fahs – VAT Inspection Command Center</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c201d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fahs">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
body.syncing .content input,body.syncing .content select,body.syncing .content textarea,body.syncing .content button{pointer-events:none;opacity:.75}
/* Layout: dark command-center rail + light working canvas; content in cards on a 12px rhythm. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#f6f8f7; --line:#dfe6e3; --line-2:#cbd5d1;
  --ink:#0f1c1a; --ink-2:#44524f; --muted:#74827f;
  --brand:#0b6b5f; --brand-2:#0f8a7a; --brand-ink:#ffffff; --brand-soft:#e1f1ed; --gold:#a8792c; --gold-2:#e3b866;
  --rail:#0c201d; --rail-2:#12302b; --rail-ink:#d7e5e1; --rail-muted:#7e9a94; --rail-line:#1c3a35;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e3e2db; --axis:#c3c2b7;
  --good:#0ca30c; --good-ink:#0a6b23; --good-bg:#e2f4e6; --warn:#fab219; --warn-ink:#7a5200; --warn-bg:#fff2d2;
  --crit:#d03b3b; --crit-ink:#b42323; --crit-bg:#fbe5e4; --none-ink:#6b7875; --none-bg:#edf1f0;
  --input:#fffdf4; --input-line:#e5dcae;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(12,32,29,.05),0 4px 16px rgba(12,32,29,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1211; --surface:#111b19; --surface-2:#15211f; --line:#22312e; --line-2:#2e403c; --ink:#e6eeec; --ink-2:#b2c1bd; --muted:#7f8f8b;
  --brand:#2fb39c; --brand-2:#4cc9b1; --brand-ink:#04211c; --brand-soft:#113a33; --gold:#d6a957; --gold-2:#e3b866;
  --rail:#060d0c; --rail-2:#0f2420; --rail-ink:#cfe0db; --rail-muted:#6f8a84; --rail-line:#16302b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835;
  --good-ink:#4fd27f; --good-bg:#11301d; --warn-ink:#f2c14e; --warn-bg:#352a0e; --crit-ink:#ff8080; --crit-bg:#3a1a1a; --none-ink:#8d9a97; --none-bg:#1b2624;
  --input:#17201b; --input-line:#3a4632; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1211; --surface:#111b19; --surface-2:#15211f; --line:#22312e; --line-2:#2e403c; --ink:#e6eeec; --ink-2:#b2c1bd; --muted:#7f8f8b;
  --brand:#2fb39c; --brand-2:#4cc9b1; --brand-ink:#04211c; --brand-soft:#113a33; --gold:#d6a957; --gold-2:#e3b866;
  --rail:#060d0c; --rail-2:#0f2420; --rail-ink:#cfe0db; --rail-muted:#6f8a84; --rail-line:#16302b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2c2c2a; --axis:#383835;
  --good-ink:#4fd27f; --good-bg:#11301d; --warn-ink:#f2c14e; --warn-bg:#352a0e; --crit-ink:#ff8080; --crit-bg:#3a1a1a; --none-ink:#8d9a97; --none-bg:#1b2624;
  --input:#17201b; --input-line:#3a4632; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
/* rail */
nav.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.logo{width:38px;height:38px;flex:none}
.wordmark{font:700 21px/1 var(--f-display);letter-spacing:.01em;color:#fff}
.tagline{font-size:11.5px;color:var(--rail-muted);margin-top:4px;line-height:1.3}
.entity{background:var(--rail-2);border:1px solid var(--rail-line);border-radius:10px;padding:10px 12px;margin:0 4px 10px}
.ename{font-weight:600;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evat{font:12px var(--f-mono);color:var(--rail-muted)}
.nav-group{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:14px 12px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--rail-ink);font:500 13.5px var(--f-body);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start}
.nav-btn:hover{background:var(--rail-2)}
.nav-btn[aria-current="true"]{background:var(--rail-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
[dir="rtl"] .nav-btn[aria-current="true"]{box-shadow:inset -3px 0 0 var(--gold-2)}
.nav-btn .ic{width:18px;height:18px;opacity:.85}
.nl{flex:1}
.badge{background:var(--crit);color:#fff;font:600 11px var(--f-mono);min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav-foot{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--rail-muted);padding:14px 10px 0;border-top:1px solid var(--rail-line)}
.nav-foot .ic{width:16px;height:16px;flex:none;margin-top:1px}
/* main */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
.tb-title{flex:1;min-width:0}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:22px 28px 64px;display:flex;flex-direction:column;gap:18px;max-width:1440px}
.lead{margin:0;color:var(--ink-2);max-width:80ch;font-size:14.5px}
.note{color:var(--muted);font-size:12.5px;margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:30px;height:30px;color:var(--brand)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
/* buttons & chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--ink);font:inherit;padding:0;cursor:pointer;text-align:start}
.link:hover{color:var(--brand);text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 12.5px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .cnt{font:600 11px var(--f-mono);opacity:.75}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}.dotc.ok{background:var(--good)}.dotc.bad{background:var(--crit)}.dotc.none{background:var(--line-2)}
.chip-s{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--none-bg);color:var(--none-ink)}
.chip-s.ok{background:var(--good-bg);color:var(--good-ink)}.chip-s.warn{background:var(--warn-bg);color:var(--warn-ink)}.chip-s.bad{background:var(--crit-bg);color:var(--crit-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--none-bg);color:var(--none-ink)}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--good-bg);color:var(--good-ink)}.pill.bad{background:var(--crit-bg);color:var(--crit-ink)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.sev{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:5px;border:1px solid}
.sev.high{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-bg)}
.sev.medium{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-bg)}
.sev.low{color:var(--none-ink);border-color:var(--line-2);background:var(--none-bg)}
.sevrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* tiles & cards */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);text-align:start;font:inherit;color:inherit}
button.tile{cursor:pointer}button.tile:hover{border-color:var(--brand)}
.t-lab{font-size:12.5px;color:var(--muted);font-weight:500}
.t-val{font:600 24px/1.1 var(--f-display);color:var(--ink)}
.t-val.big{font-size:34px}
.t-val small{font:500 13px var(--f-body);color:var(--muted)}
.t-sub{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile.hero{position:relative;overflow:hidden}
.tile.hero::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.tile.hero.ok::before{background:var(--good)}.tile.hero.warn::before{background:var(--warn)}.tile.hero.bad::before{background:var(--crit)}
.tile.okv .t-val{color:var(--good-ink)}.tile.badv .t-val{color:var(--crit-ink)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h h2{font:600 15.5px/1.3 var(--f-display);margin:0;flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:10px 14px;color:var(--ink)}
.banner .ic{color:var(--warn-ink)}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:var(--r);padding:14px 16px}
.callout.ok{border-inline-start-color:var(--good)}
.callout p{margin:4px 0 0;color:var(--ink-2);max-width:95ch}
.callout .ic{width:20px;height:20px;color:var(--good-ink);margin-top:2px}
.empty{display:flex;gap:8px;align-items:center;color:var(--muted);margin:0;padding:10px 4px}
.empty .ic{color:var(--good-ink)}
/* tables */
.frame{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tbl thead th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl th.n,.tbl td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.n{direction:ltr}
.tbl tr.total td{background:var(--surface-2);font-weight:600}
.tbl tfoot tr.total td{position:sticky;bottom:0;border-top:2px solid var(--line-2);z-index:1}
.tbl tr.sub th{background:var(--surface);text-align:start;color:var(--brand);font-size:12px;letter-spacing:.04em}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .neg{color:var(--crit-ink);font-weight:600}
.tbl td.calc{background:var(--surface-2)}
.tbl th.calc{color:var(--brand)}
.tbl td.flags{color:var(--crit-ink);font-size:12px;min-width:260px}
.tbl.edit td{padding:3px 4px}
.tbl input,.tbl select,.fld input,.fld select,.fld textarea{width:100%;min-width:90px;background:var(--input);border:1px solid var(--input-line);color:var(--ink);border-radius:6px;padding:5px 7px;font:13px var(--f-body)}
.tbl input.num,.fld input.num{text-align:right;font-family:var(--f-mono);direction:ltr}
.rowno{color:var(--muted);font:11px var(--f-mono);text-align:end}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 8px;border-radius:6px}
.del:hover{color:var(--crit-ink);background:var(--crit-bg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tip-line{margin-top:-8px}
.boxno{font:600 12px var(--f-mono);color:var(--brand);white-space:nowrap}
.boxname{display:flex;flex-direction:column}.boxname .ar{font-size:12px;color:var(--muted)}
.h3{font:600 16px var(--f-display)}
/* heat matrix */
.heat td.h{width:40px;min-width:36px;text-align:center;padding:5px 2px;cursor:pointer}
.heat th.c{text-align:center}
.heat td:first-child{white-space:nowrap}
.cell{display:inline-flex;width:28px;height:24px;border-radius:6px;align-items:center;justify-content:center}
.cell .ic{width:14px;height:14px;stroke-width:2.6}
.cell.ok{background:var(--good-bg);color:var(--good-ink)}.cell.bad{background:var(--crit-bg);color:var(--crit-ink)}.cell.none{background:var(--none-bg);color:var(--line-2)}
/* forms */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.form-grid.four{grid-template-columns:repeat(3,minmax(0,220px))}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500;min-width:0}
.fld small{color:var(--muted);font-weight:400}
.fld.inline{flex-direction:row;align-items:center;gap:8px}.fld.inline input{width:auto;min-width:140px}
.drop{display:flex;gap:16px;align-items:center;border:2px dashed var(--line-2);border-radius:var(--r);padding:18px 20px;flex-wrap:wrap}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop p{margin:4px 0 0;color:var(--muted);font-size:13px}.drop>div{flex:1;min-width:220px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.steps li b::before{content:counter(st);display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:600 12px var(--f-mono);align-items:center;justify-content:center;margin-inline-end:8px}
.steps li span{color:var(--ink-2);font-size:12.5px}
/* charts */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--grid);stroke-width:1}.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--muted);font:11px var(--f-mono)}
.chart .mark{transition:opacity .15s}
.barlist{display:flex;flex-direction:column;gap:9px}
.bl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bl-track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bl-bar{display:block;height:100%;border-radius:0 4px 4px 0}
[dir="rtl"] .bl-bar{border-radius:4px 0 0 4px;margin-inline-start:auto;margin-left:auto}
.bl-val{min-width:90px;text-align:end;direction:ltr}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0 0;border-top:1px solid var(--line);font-size:13px}
.sum-row.good b{color:var(--good-ink)}.sum-row.tot{font-weight:600;font-size:14px}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:320px}
.bf{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px}
/* tests */
.tests{display:flex;flex-direction:column;gap:8px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.test.fail{border-inline-start:4px solid var(--crit)}.test.pass{border-inline-start:4px solid var(--good)}.test.na{border-inline-start:4px solid var(--line-2)}
.test-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:11px 14px;cursor:pointer;text-align:start;flex-wrap:wrap}
.test-h:hover{background:var(--surface-2)}
.st{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center}
.st .ic{width:14px;height:14px;stroke-width:2.6}
.st.fail{background:var(--crit-bg);color:var(--crit-ink)}.st.pass{background:var(--good-bg);color:var(--good-ink)}.st.na{background:var(--none-bg);color:var(--muted)}
.tid{color:var(--muted);font-size:12px}.tt{font-weight:600}.area{font-size:12px;color:var(--muted)}
.tm{min-width:80px;text-align:end;font-size:12.5px;color:var(--ink-2);direction:ltr}
.test-b{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
/* modal, toast, splash */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:65;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.modal p{margin-top:0}
.modal textarea{width:100%;height:180px;font:12px var(--f-mono);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}

function D(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}
function addM(d,n){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1))}
function eom(d){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0))}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const showDate=s=>{const d=typeof s==="string"?D(s):s;return d?`${pad(d.getUTCDate())} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`:""};
function normDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==="number"&&v>20000&&v<80000)return iso(new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5));
  const s=String(v).trim();let m;
  if((m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(s)))return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if((m=/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s](\d{4})/.exec(s))){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)return `${m[3]}-${pad(i+1)}-${pad(m[1])}`}
  if(/^\d{5}$/.test(s))return normDate(+s);
  return s;
}
function normSel(v,opts){if(v==null)return "";const s=String(v).trim();if(!s)return "";const hit=opts.find(o=>o.toLowerCase()===s.toLowerCase());if(hit)return hit;const rev=opts.find(o=>AR[o]===s);if(rev)return rev;const part=opts.find(o=>o.toLowerCase().startsWith(s.toLowerCase()));return part||s}

const daysBetween=(a,b)=>Math.round((b-a)/864e5);
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3400)}
function confirmBox(msg,okLabel,onOk){const back=document.createElement("div");back.className="modal-back";back.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row end"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">${esc(okLabel)}</button></div></div>`;document.body.appendChild(back);back.querySelector("#mCancel").onclick=()=>back.remove();back.querySelector("#mOk").onclick=()=>{back.remove();onOk()};back.querySelector("#mOk").focus()}
function copyText(txt){const fallback=()=>{const back=document.createElement("div");back.className="modal-back";back.innerHTML=`<div class="modal"><p>Select all and copy (Ctrl+C), then paste into Excel.</p><textarea readonly></textarea><div class="row end"><button class="btn">Close</button></div></div>`;document.body.appendChild(back);const ta=back.querySelector("textarea");ta.value=txt;ta.select();back.querySelector("button").onclick=()=>back.remove()};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copied. Paste it into Excel."),fallback)}catch(e){fallback()}}
// seeded random for reproducible samples
function rng(seed){let a=0;for(const ch of String(seed))a=(a*31+ch.charCodeAt(0))>>>0;a=a||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function trCore(c){if(AR[c]!=null)return AR[c];for(const[re,f]of PAT){const m=re.exec(c);if(m)return f(m)}if(c.includes("; ")){const t=c.split("; ").map(p=>AR[p]);if(t.every(x=>x!=null))return t.join("؛ ")}return null}

function translateNode(root){
  if(LANG!=="ar"||!root)return;
  if(root.nodeType===3){const p=root.parentElement;if(!p||p.closest("script,style,textarea,[data-notr]"))return;const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return}
  if(root.nodeType!==1)return;
  if(root.closest&&root.closest("script,style,textarea,[data-notr]"))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];let n;while((n=w.nextNode()))list.push(n);list.forEach(translateNode);
  [root,...root.querySelectorAll("[title],[aria-label],[placeholder]")].forEach(el=>{if(!el.getAttribute)return;for(const a of["title","aria-label","placeholder"]){const v=el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t)}}});
}

function periods(){
  let fy=D(S.setup.fy)||D("2025-01-01"); fy=new Date(Date.UTC(fy.getUTCFullYear(),fy.getUTCMonth(),1));
  const n=S.setup.freq==="Quarterly"?4:12, mp=12/n, out=[];
  for(let i=0;i<n;i++){const st=addM(fy,i*mp), en=new Date(addM(fy,(i+1)*mp)-864e5), due=eom(addM(en,1));
    out.push({i,no:i+1,st,en,due,label:n===12?`${MON[st.getUTCMonth()]} ${st.getUTCFullYear()}`:`Q${i+1} ${st.getUTCFullYear()}`,short:n===12?MON[st.getUTCMonth()]:`Q${i+1}`,months:Array.from({length:mp},(_,k)=>i*mp+k)})}

function monthLabels(){let fy=D(S.setup.fy)||D("2025-01-01");return Array.from({length:12},(_,m)=>{const d=addM(fy,m);return `${MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`})}
function periodOf(ps,s){const d=D(s);if(!d)return 0;const p=ps.find(p=>d>=p.st&&d<=p.en);return p?p.no:0}
function monthsLate(due,d){if(!due||!d||d<=due)return 0;return (d.getUTCFullYear()-due.getUTCFullYear())*12+d.getUTCMonth()-due.getUTCMonth()+(d.getUTCDate()>due.getUTCDate()?1:0)}
const normNo=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");

function salesCalc(r,ps,c){
  if(!r.date&&!r.no&&!r.net)return null;
  const p=periodOf(ps,r.date), net=num(r.net), vat=num(r.vat), exp=r.cat===SALES_CATS[0]?r2(net*c.rate):0, diff=r2(vat-exp), f=[];
  if(!p)f.push("Date outside audit periods");
  if(!r.cat)f.push("No VAT category");
  if(Math.abs(diff)>c.tol)f.push("VAT ≠ 15% × net");
  if(r.ctype===CUST_TYPES[0]&&!vatOk(r.cvat))f.push("Invalid or missing customer VAT no");
  if(r.fat!=="Yes")f.push("Not reported/cleared on FATOORA");
  if((r.cat===SALES_CATS[2]||r.cat===SALES_CATS[3])&&!String(r.ev||"").trim())f.push("Zero-rate/export evidence missing");
  if(r.type==="Credit Note"&&net>0)f.push("Credit note should be negative");
  if(r.type==="Simplified Tax Invoice"&&r.ctype===CUST_TYPES[0])f.push("Simplified invoice to VAT-registered B2B");
  if(r.cat&&!SALES_CATS.includes(r.cat))f.push("Unknown VAT category");
  return{p,net,vat,exp,diff,total:net+vat,flags:f};
}
function purCalc(r,ps,c,dup){

// The active year's data lives in S (S.tb, S.returns, ...). Other years are parked in S.years[label].
// Shared across years: company settings, inspection case, ZATCA requests and the document checklist.
const YEARLY=["tb","returns","sales","purchases","payments","recItems","decisions","vouch","sample"];
const yearOf=fy=>String((D(fy)||D("2025-01-01")).getUTCFullYear());
function blankYear(label,freq){return{fy:`${label}-01-01`,freq:freq||"Monthly",tb:[],returns:Array.from({length:12},blankReturn),sales:[],purchases:[],payments:[],
  recItems:[{d:"Timing – invoices booked in a different period",a:""},{d:"Revenue accruals not yet invoiced",a:""},{d:"Other",a:""}],decisions:{},vouch:{},sample:{pop:"sales",size:"25",seed:label}}}
function ensureYears(){if(!S.years)S.years={};if(!S.year)S.year=yearOf(S.setup.fy);}
function activeSnap(){const o={fy:S.setup.fy,freq:S.setup.freq};YEARLY.forEach(k=>o[k]=S[k]);return o}
function allYears(){ensureYears();const m={...S.years};m[S.year]=activeSnap();return m}
const yearLabels=()=>Object.keys(allYears()).sort();
function switchYear(label){ensureYears();if(label===S.year)return;S.years[S.year]=activeSnap();const t=S.years[label]||blankYear(label,S.setup.freq);delete S.years[label];
  YEARLY.forEach(k=>S[k]=t[k]);S.setup.fy=t.fy;S.setup.freq=t.freq;S.year=label;UI.ret.p=0;try{localStorage.setItem(KEY+"-year",label)}catch(e){}}
function addYear(label){ensureYears();label=String(label);if(allYears()[label])return false;S.years[label]=blankYear(label,S.setup.freq);return true}
function removeYear(label){ensureYears();if(label===S.year||!S.years[label])return false;delete S.years[label];return true}

  try{return fn()}finally{YEARLY.forEach(k=>S[k]=keep[k]);S.setup.fy=keep.fy;S.setup.freq=keep.freq}}

SCHEMA.years={kind:"rows",headers:["year","fy","freq"],get:()=>Object.entries(allYears()).sort().map(([y,v])=>[y,v.fy,v.freq]),set:()=>{}};
function toTable(k){
  if(!YEARLY.includes(k))return toTableRaw(k);
  const yrs=allYears();let headers=null;const rows=[];
  for(const y of Object.keys(yrs).sort()){const t=withYear(y,()=>toTableRaw(k));headers=t.headers;t.rows.forEach(r=>rows.push([y,...r]))}
  return{headers:["year",...(headers||toTableRaw(k).headers)],rows};

let pendingYears=null; // rows from the Years tab, applied after all tabs are read
function fromTable(k,t){
  if(k==="years"){pendingYears=t;return}
  if(!YEARLY.includes(k))return fromTableRaw(k,t);
  if(!t||!t.rows)return;
  const hasYear=t.headers&&t.headers[0]==="year";
  const groups={};
  if(!hasYear)groups[yearOf(S.setup.fy)]=t.rows; // older single-year format
  else t.rows.forEach(r=>{const y=String(r[0]||"").trim();if(y)(groups[y]=groups[y]||[]).push(r.slice(1))});
  const raw=hasYear?{headers:t.headers.slice(1)}:{headers:t.headers};
  if(!window.__yearRows)window.__yearRows={};
  for(const [y,rows] of Object.entries(groups)){(window.__yearRows[y]=window.__yearRows[y]||{})[k]={headers:raw.headers,rows}}
}
// Build S (active year) and S.years from what fromTable collected.
function finishYears(preferred){
  const rowsBy=window.__yearRows||{};window.__yearRows=null;
  const info={};(pendingYears&&pendingYears.rows||[]).forEach(r=>{if(r[0])info[String(r[0])]={fy:r[1]||`${r[0]}-01-01`,freq:r[2]||"Monthly"}});pendingYears=null;
  const labels=[...new Set([...Object.keys(info),...Object.keys(rowsBy)])].sort();
  if(!labels.length)labels.push(yearOf(S.setup.fy));
  const built={};
  for(const y of labels){const inf=info[y]||{fy:y===yearOf(S.setup.fy)?S.setup.fy:`${y}-01-01`,freq:S.setup.freq||"Monthly"};const yb=blankYear(y,inf.freq);yb.fy=inf.fy;
    const keep={};YEARLY.forEach(k=>keep[k]=S[k]);YEARLY.forEach(k=>S[k]=yb[k]);
    for(const k of YEARLY){const t=(rowsBy[y]||{})[k];if(t)fromTableRaw(k,t);yb[k]=S[k]}
    YEARLY.forEach(k=>S[k]=keep[k]);built[y]=yb}
  let act=preferred&&built[preferred]?preferred:null;try{const saved=localStorage.getItem(KEY+"-year");if(!act&&saved&&built[saved])act=saved}catch(e){}
  if(!act)act=labels[labels.length-1];
  const a=built[act];delete built[act];YEARLY.forEach(k=>S[k]=a[k]);S.setup.fy=a.fy;S.setup.freq=a.freq;S.year=act;S.years=built;
}

function columnChart(cats,series,{h=220,fmtv=fmt0,pct=false,id=""}={}){

  const max=niceMax(Math.max(...series.flatMap(s=>s.values.map(v=>Math.max(0,v))),0)), y=v=>padT+ih-ih*Math.max(0,v)/max;
  const band=iw/cats.length, bars=series.filter(s=>s.type!=="line"), gw=band*0.66, bw=Math.max(3,Math.min(22,gw/Math.max(1,bars.length)-2));

  <div class="grid2">${card(L("Exposure by scenario (SAR)","التعرض حسب السيناريو (ريال)"),`<div class="frame"><table class="tbl" id="t-exp"><thead><tr><th></th><th class="n">${esc(L("A: no action","أ: دون إجراء"))}</th><th class="n">${esc(L("B: correct under the initiative","ب: التصحيح ضمن المبادرة"))}</th></tr></thead><tbody>

   ${row(L("Total","الإجمالي"),E.A,E.B,"total")}</tbody></table></div><p class="note">${esc(L("Output exposure takes the higher of under-declared VAT and unexplained revenue × rate, so one error is never counted twice. Late filing can reach 25%; 5% is shown.","يؤخذ تعرض المخرجات بالأعلى بين الضريبة غير المُقر بها والإيرادات غير المفسرة × النسبة، فلا يُحتسب الخطأ مرتين. قد تصل غرامة التأخر في التقديم إلى 25%، والمعروض 5%."))}</p><div class="row"><button class="btn sm" data-copy="t-exp">${esc("Copy table")}</button></div>`)}
   ${card(L("Exposure by period (SAR)","التعرض حسب الفترة (ريال)"),(()=>{const rs=E.rows.filter(r=>r.tax||r.allPen);return rs.length?`<div class="frame"><table class="tbl"><thead><tr><th>${esc("Period")}</th><th class="n">${esc(L("Tax","الضريبة"))}</th><th class="n">${esc(L("Penalties","الغرامات"))}</th><th>${esc(L("Initiative","المبادرة"))}</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.tax)}${nc(r.allPen)}<td>${r.eligible&&E.active?pill("ok",L("Eligible","مؤهلة")):pill("none",L("Not eligible","غير مؤهلة"))}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">${icon("check")}${esc(L("No exposure in any period.","لا يوجد تعرض في أي فترة."))}</p>`})())}</div>

  <div class="tiles four">${tile(L("Population value (SAR)","قيمة المجتمع (ريال)"),`<span class="num">${fmt0(sm.total)}</span>`)}${tile(L("Sampling interval","فترة المعاينة"),`<span class="num">${fmt0(sm.interval)}</span>`)}${tile(L("Tested","تم فحصها"),`${tested} / ${it.length}`)}${tile(L("Exceptions","الاستثناءات"),exc,"",exc?"badv":"")}</div>
  ${card(L("Sample","العينة"),it.length?`<div class="frame"><table class="tbl edit" id="t-samp"><thead><tr><th>#</th><th>${esc(L("Reference","المرجع"))}</th><th>${esc(L("Date","التاريخ"))}</th><th>${esc(L("Party","الطرف"))}</th><th class="n">${esc(L("Net (SAR)","الصافي (ريال)"))}</th><th class="n">${esc(L("VAT (SAR)","الضريبة (ريال)"))}</th><th>${esc(L("Result","النتيجة"))}</th><th>${esc("Notes")}</th></tr></thead><tbody>
   ${it.map((o,k)=>{const v=S.vouch[o.key]||{s:"Not tested",n:""};return `<tr><td class="rowno">${k+1}</td><td class="mono">${esc(o.r.no)}</td><td>${esc(showDate(o.r.date))}</td><td data-notr>${esc(o.r.cust||o.r.sup||"")}</td>${nc(o.x.net)}${nc(o.x.vat)}<td><select data-vk="${esc(o.key)}" data-f="s">${VOUCH.map(x=>`<option value="${x}"${x===v.s?" selected":""}>${esc(L(x,{"Not tested":"لم يُفحص","Agreed":"مطابق","Exception":"استثناء"}[x]))}</option>`).join("")}</select></td><td><input data-vk="${esc(o.key)}" data-f="n" value="${esc(v.n)}" style="min-width:200px"></td></tr>`}).join("")}</tbody></table></div><div class="row"><button class="btn sm" data-copy="t-samp">${esc("Copy table")}</button></div>`:`<p class="empty">${esc(L("No invoices in this register yet.","لا توجد فواتير في هذا السجل بعد."))}</p>`)}`};

   <div class="frame"><table class="tbl"><thead><tr><th>#</th><th>${esc("Period")}</th><th>${esc("Start")}</th><th>${esc("End")}</th><th>${esc("Return & payment due")}</th></tr></thead><tbody>${C.ps.map(p=>`<tr><td>${p.no}</td><td>${p.label}</td><td>${showDate(p.st)}</td><td>${showDate(p.en)}</td><td>${showDate(p.due)}</td></tr>`).join("")}</tbody></table></div>`)}

// logo: shrink to at most 160px and store as a small PNG data URL in the settings
function readLogo(file,done){const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,160/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
  let u=cv.toDataURL("image/png");if(u.length>40000)u=cv.toDataURL("image/webp",.85);if(u.length>40000||!u.startsWith("data:image/webp")&&!u.startsWith("data:image/png"))u=cv.toDataURL("image/jpeg",.85);done(u)};img.onerror=()=>toast(L("That file is not an image.","هذا الملف ليس صورة."));img.src=rd.result};rd.readAsDataURL(file)}
AFTER.setup=()=>{
  const lf=$("#logoFile");if(lf)lf.onchange=()=>{const f=lf.files[0];if(!f)return;if(f.size>5e6){toast(L("Use an image under 5 MB.","استخدم صورة أصغر من 5 ميجابايت."));return}readLogo(f,u=>{S.setup.logo=u;save();render();toast(L("Logo saved","تم حفظ الشعار"))})};
  const ld=$("#logoDel");if(ld)ld.onclick=()=>{S.setup.logo="";save();render()};document.querySelectorAll("[data-s]").forEach(el=>{el.addEventListener("change",()=>{S.setup[el.dataset.s]=el.value;save();render()});el.addEventListener("input",()=>{S.setup[el.dataset.s]=el.value;save();if(el.dataset.s==="vat")$("#vatchk").innerHTML=vatOk(el.value)?pill("ok","Valid format"):pill("bad","Invalid format")})})};

 ${card(L("Document checklist","قائمة المستندات"),`<div class="frame"><table class="tbl edit" id="t-chk"><thead><tr><th>#</th><th>${esc("Area")}</th><th>${esc("Document or analysis")}</th><th>${esc("Prepared in this app")}</th><th>${esc("Status")}</th><th>${esc("Owner")}</th><th>${esc("File reference")}</th><th>${esc("Notes")}</th></tr></thead><tbody>

R.method=C=>{const firms=[["KPMG","AVA / Tax Intelligence Solution",L("Tests the whole invoice population, predicts mis-booked invoices with machine learning, then an expert validates every hit.","يختبر جميع الفواتير، ويتنبأ بالفواتير المسجلة خطأً بالتعلم الآلي، ثم يتحقق خبير من كل نتيجة."),L("100% testing + human decision on every finding","اختبار 100% + قرار بشري لكل ملاحظة")],
  ["Deloitte","Global VAT/GST Radar · myInsight",L("Predefined checks and balances on VAT data, one dashboard, and an issue log with management reporting.","فحوصات محددة مسبقاً على بيانات الضريبة، ولوحة واحدة، وسجل ملاحظات مع تقارير للإدارة."),L("Numbered test library + findings register","مكتبة اختبارات مرقمة + سجل ملاحظات")],
  ["EY","Global VAT Reporting Tool",L("Uploads data from many systems, parameter tests, anomaly detection, tax calendar and an audit trail for returns.","رفع البيانات من عدة أنظمة، واختبارات معيارية، وكشف الأنماط غير الطبيعية، وتقويم ضريبي، وسجل تدقيق للإقرارات."),L("Data hub, anomaly analytics, deadlines, audit log","مركز بيانات، وتحليلات الأنماط، والمواعيد، وسجل التدقيق")],
  ["PwC","Indirect Tax Edge · VAT Data Check",L("Controls testing over 100% of transactions with 200+ compliance and data-quality checks.","اختبار الضوابط على 100% من المعاملات بأكثر من 200 فحص للالتزام وجودة البيانات."),L("Data-quality tests separated from tax tests","فصل اختبارات جودة البيانات عن الاختبارات الضريبية")],
  ["BDO","ONESOURCE Fast VAT (KSA/UAE)",L("Automated return preparation and periodic VAT health checks for GCC clients.","إعداد آلي للإقرارات وفحوصات دورية لسلامة الضريبة لعملاء الخليج."),L("Return-level controls and tie-outs","ضوابط على مستوى الإقرار ومطابقاته")],
  ["ZATCA",L("Risk engine and audit process","محرك المخاطر وإجراءات الفحص"),L("Selects cases by analytics (mismatches, frequent amendments, large refunds, e-invoice inconsistencies), then document requests, queries, assessment, objection.","تختار الحالات بالتحليلات (الفروق، التعديلات المتكررة، الاستردادات الكبيرة، تعارضات الفوترة الإلكترونية)، ثم طلب المستندات، والاستفسارات، والتقييم، والاعتراض."),L("Tests mirror ZATCA's risk triggers; case file tracks every request","الاختبارات تحاكي مؤشرات الهيئة؛ وملف الفحص يتابع كل طلب")]];

function authTabs(){const a=sync.state;return `<div class="auth-tabs" role="tablist"><button type="button" role="tab" data-as="login" aria-selected="${a==="login"}">${esc(L("Sign in","تسجيل الدخول"))}</button><button type="button" role="tab" data-as="signup" aria-selected="${a==="signup"}">${esc(L("Sign up","إنشاء حساب"))}</button></div>`}
function authExtraScreen(brand,foot){
  const st=sync.state;
  if(st==="signup")return `<div class="auth">${welcomePanel()}<form class="auth-card" id="authForm" autocomplete="on">${brand}${authTabs()}
   <p class="note">${esc(L("Request access. An administrator approves new accounts before they can sign in.","اطلب الوصول. يوافق المدير على الحسابات الجديدة قبل أن تتمكن من تسجيل الدخول."))}</p>
   <label class="fld"><span>${esc(L("Full name","الاسم الكامل"))}</span><input id="sName" required autocomplete="name"></label>
   <label class="fld"><span>${esc(L("Email (sign-in codes are sent here)","البريد الإلكتروني (تُرسل إليه رموز الدخول)"))}</span><input id="sMail" type="email" required autocomplete="email" dir="ltr"></label>
   <label class="fld"><span>${esc(L("Username","اسم المستخدم"))}</span><input id="sUser" required autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr"></label>
   <label class="fld"><span>${esc(L("Password","كلمة المرور"))}</span><input id="sPass" type="password" required autocomplete="new-password" dir="ltr"></label>
   <label class="fld"><span>${esc(L("Confirm password","تأكيد كلمة المرور"))}</span><input id="sPass2" type="password" required autocomplete="new-password" dir="ltr"></label>
   <p class="note">${esc(ERR.weak)}</p><p class="auth-err" id="aErr" role="alert">${esc(sync.msg||"")}</p>
   <button class="btn primary" type="submit" id="aGo">${icon("users")}${esc(L("Request access","طلب الوصول"))}</button>${foot}</form></div>`;
  if(st==="forgot"||st==="reset")return `<div class="auth">${welcomePanel()}<form class="auth-card" id="authForm" autocomplete="off">${brand}
   <h1>${esc(L("Reset your password","إعادة تعيين كلمة المرور"))}</h1>
   ${st==="forgot"?`<p class="note">${esc(L("Enter your username. We'll email a 6-digit code to the address on your account.","أدخل اسم المستخدم، وسنرسل رمزاً من 6 أرقام إلى بريدك المسجل."))}</p>
    <label class="fld"><span>${esc(L("Username","اسم المستخدم"))}</span><input id="fUser" required autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr"></label>`
   :`<p class="note"><span>${esc(L("If the username exists, we sent a code to","إذا كان اسم المستخدم موجوداً فقد أرسلنا رمزاً إلى"))}</span> <b dir="ltr" data-notr>${esc(AUTH.otpTo||"***")}</b>.</p>
    <label class="fld"><span>${esc(L("Code from the email","الرمز من البريد الإلكتروني"))}</span><input id="fCode" class="num otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required dir="ltr"></label>
    <label class="fld"><span>${esc(L("New password","كلمة المرور الجديدة"))}</span><input id="fPass" type="password" required autocomplete="new-password" dir="ltr"></label>
    <label class="fld"><span>${esc(L("Confirm new password","تأكيد كلمة المرور الجديدة"))}</span><input id="fPass2" type="password" required autocomplete="new-password" dir="ltr"></label><p class="note">${esc(ERR.weak)}</p>`}
   <p class="auth-err" id="aErr" role="alert">${esc(sync.msg||"")}</p>
   <button class="btn primary" type="submit" id="aGo">${icon(st==="forgot"?"dl":"lock")}${esc(st==="forgot"?L("Email me a code","أرسل لي رمزاً"):L("Set new password","تعيين كلمة المرور الجديدة"))}</button>
   <button type="button" class="btn ghost sm switch" data-as="login">${esc(L("Back to sign in","العودة لتسجيل الدخول"))}</button>${foot}</form></div>`;
  return null;
}
function bindAuthExtra(){
  document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{sync.msg="";sync.state=b.dataset.as;render()});
  const st=sync.state,f=$("#authForm"),err=$("#aErr"),go=$("#aGo");if(!["signup","forgot","reset"].includes(st))return false;
  const busy=on=>{go.disabled=on;go.classList.toggle("busy",on)};
  ($("#sName")||$("#fUser")||$("#fCode"))?.focus();
  f.onsubmit=async e=>{e.preventDefault();err.textContent="";busy(true);
    try{
      if(st==="signup"){if($("#sPass").value!==$("#sPass2").value){err.textContent=ERR.mismatch;return}
        const r=await api("signup",{name:$("#sName").value,email:$("#sMail").value.trim(),username:$("#sUser").value.trim().toLowerCase(),password:$("#sPass").value});
        if(!r.ok){err.textContent=errText(r.error);return}
        sync.state="login";sync.msg=L("Request sent. You can sign in once an administrator approves your account.","تم إرسال الطلب. يمكنك تسجيل الدخول بعد موافقة المدير على حسابك.");render();return}
      if(st==="forgot"){const r=await api("forgot",{username:$("#fUser").value.trim().toLowerCase()});if(!r.ok){err.textContent=errText(r.error);return}AUTH.challenge=r.challenge;AUTH.otpTo=r.to;sync.msg="";sync.state="reset";render();return}
      if(st==="reset"){if($("#fPass").value!==$("#fPass2").value){err.textContent=ERR.mismatch;return}
        const r=await api("resetPassword",{challenge:AUTH.challenge,code:$("#fCode").value.trim(),password:$("#fPass").value});
        if(!r.ok){err.textContent=r.error==="badcode"?L(`Wrong code. ${r.left} attempt(s) left.`,`رمز غير صحيح. متبقٍ ${r.left} محاولة.`):errText(r.error);if(r.error==="expired"){sync.state="forgot";sync.msg=ERR.expired;render()}return}
        sync.state="login";sync.msg=L("Password changed. Sign in with your new password.","تم تغيير كلمة المرور. سجّل الدخول بكلمة المرور الجديدة.");render();return}
    }catch(x){err.textContent=ERR.net}finally{busy(false)}};
  $("#authLang").onclick=()=>{LANG=LANG==="ar"?"en":"ar";try{localStorage.setItem(KEY+"-lang",LANG)}catch(e){}applyLang();render()};
  return true;
}

function bindAuth(){
  if(bindAuthExtra())return;
  const f=$("#authForm"),err=$("#aErr"),go=$("#aGo");($("#aOtp")||$("#aCode")||$("#aUser"))?.focus();
  $("#authLang").onclick=()=>{LANG=LANG==="ar"?"en":"ar";try{localStorage.setItem(KEY+"-lang",LANG)}catch(e){}applyLang();render()};
  const busy=on=>{go.disabled=on;go.classList.toggle("busy",on)};
  const toOtp=r=>{AUTH.challenge=r.challenge;AUTH.otpTo=r.to;sync.msg="";sync.state="otp";render()};
  if(sync.state==="otp"){
    $("#aBack").onclick=()=>{AUTH.challenge=null;sync.msg="";sync.state="login";render()};
    $("#aResend").onclick=async()=>{err.textContent="";try{const r=await api("resendOtp",{challenge:AUTH.challenge});if(!r.ok){err.textContent=r.error==="wait"?L(`Please wait ${r.seconds} seconds before asking for a new code.`,`يرجى الانتظار ${r.seconds} ثانية قبل طلب رمز جديد.`):errText(r.error);if(r.error==="expired"){sync.state="login";sync.msg=err.textContent;render()}return}toast(L("A new code has been sent.","تم إرسال رمز جديد."))}catch(x){err.textContent=ERR.net}};
    f.onsubmit=async e=>{e.preventDefault();err.textContent="";busy(true);
      try{const r=await api("verifyOtp",{challenge:AUTH.challenge,code:$("#aOtp").value.trim()});
        if(!r.ok){if(r.error==="expired"){sync.state="login";sync.msg=ERR.expired;render();return}err.textContent=r.error==="badcode"?L(`Wrong code. ${r.left} attempt(s) left.`,`رمز غير صحيح. متبقٍ ${r.left} محاولة.`):errText(r.error);return}
        setToken(r.token,AUTH.remember);AUTH.user=r.user;AUTH.challenge=null;sync.msg="";sync.state="loading";render();loadRemote();
      }catch(x){err.textContent=ERR.net}finally{busy(false)}};
    return;
  }
  const sw=$("#aSwitch");if(sw)sw.onclick=()=>{sync.msg="";sync.state=sync.state==="setup"?"login":"setup";render()};
  f.onsubmit=async e=>{e.preventDefault();err.textContent="";const user=$("#aUser").value.trim().toLowerCase(),pass=$("#aPass").value;busy(true);
    try{
      if(sync.state==="setup"){if(pass!==$("#aPass2").value){err.textContent=ERR.mismatch;return}
        const r=await api("setupAdmin",{setupCode:$("#aCode").value,name:$("#aName").value,email:$("#aMail").value.trim(),username:user,password:pass});
        if(!r.ok){err.textContent=errText(r.error);return}}
      AUTH.remember=sync.state==="setup"||!!$("#aRemember")?.checked;
      const r=await api("login",{username:user,password:pass});
      if(!r.ok){err.textContent=r.error==="locked"?L(`Too many wrong attempts. Try again in ${r.minutes} minutes.`,`محاولات خاطئة كثيرة. حاول مرة أخرى بعد ${r.minutes} دقيقة.`):errText(r.error);return}
      if(r.otp){toOtp(r);return}
      setToken(r.token,AUTH.remember);AUTH.user=r.user;sync.msg="";sync.state="loading";render();loadRemote();
    }catch(x){err.textContent=ERR.net}finally{busy(false)}};
}

IC.eye='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
IC.eyeOff='<path d="M3 3l18 18M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
function addEyes(root){root.querySelectorAll('input[type="password"]').forEach(inp=>{if(inp.parentElement.classList.contains("pw"))return;const w=document.createElement("span");w.className="pw";inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement("button");b.type="button";b.className="eye";b.setAttribute("aria-label",tr(L("Show password","إظهار كلمة المرور")));b.innerHTML=icon("eye");
  b.onclick=()=>{const show=inp.type==="password";inp.type=show?"text":"password";b.innerHTML=icon(show?"eyeOff":"eye");b.setAttribute("aria-label",tr(show?L("Hide password","إخفاء كلمة المرور"):L("Show password","إظهار كلمة المرور")));inp.focus()};w.appendChild(b)})}
const _render0=render;
render=function(){
  if(REMOTE&&["login","setup","otp","signup","forgot","reset"].includes(sync.state)){$("#nav").innerHTML="";$("#main").innerHTML=authScreen();addEyes(document);document.body.classList.add("signed-out");bindAuth();return}
  document.body.classList.remove("signed-out");document.body.classList.toggle("readonly",REMOTE&&!!AUTH.user&&!canEdit());
  const v=VIEWS.find(x=>x.id===cur);if(v&&v.admin&&!isAdmin())cur="dash"; // admin-only pages
  _render0();
  if(REMOTE&&AUTH.user)bindUserMenu();
};

if(SUPA)pushRemote=async function(){

    else rows.push({company_id:COMPANY.id,year:"",key:k,data:t,updated_by:uid,updated_at:new Date().toISOString()})}
  try{const {error}=await sbc().from("datasets").upsert(rows,{onConflict:"company_id,year,key"});sending=false;
    if(error){setSync("error",sbErr(error));return}

  const pages=Math.max(1,Math.ceil(idx.length/PAGE));if(ui.page>=pages)ui.page=pages-1;const slice=idx.slice(ui.page*PAGE,(ui.page+1)*PAGE);
  const flagBtn=(key==="sales"||key==="pur")?`<button class="btn sm" data-g="flag" aria-pressed="${ui.flagged}">${esc(ui.flagged?"Show all rows":"Show only rows with exceptions")}</button>`:"";
  const tools=`<div class="toolbar"><button class="btn sm primary" data-g="add">${esc("Add row")}</button><button class="btn sm" data-g="import">${icon("upl")}${esc("Import from Excel / CSV")}</button>${flagBtn}<button class="btn sm" data-g="copy">${esc("Copy table")}</button><button class="btn sm danger" data-g="clearall">${esc("Clear this table")}</button><span class="grow"></span><span class="note">${fmtInt(data.length)} rows${ui.flagged?` · ${fmtInt(idx.length)} with exceptions`:""}</span>${pages>1?`<button class="btn sm" data-g="prev" ${ui.page?"":"disabled"}>‹</button><span class="note">Page ${ui.page+1} of ${pages}</span><button class="btn sm" data-g="next" ${ui.page<pages-1?"":"disabled"}>›</button>`:""}</div>
  <p class="note tip-line">${esc("Tip: copy a block of cells from Excel and paste into any cell here. Rows are added automatically. Dates can be dd/mm/yyyy or yyyy-mm-dd.")}</p>`;
  const head=`<tr><th></th>${cols.map(c=>`<th class="${c.t==="num"?"n":""}">${esc(c.h)}</th>`).join("")}${comp.map(c=>`<th class="${c.n?"n":""} calc">${esc(c.h)}</th>`).join("")}<th></th></tr>`;
  const body=slice.map(i=>{const row=data[i],x=rowCalc(key,i,C);return `<tr data-i="${i}"><td class="rowno">${i+1}</td>${cols.map((c,ci)=>`<td>${cellInput(c,getV(key,row,c.k),ci)}</td>`).join("")}${comp.map((c,j)=>compCell(c,row,x,j)).join("")}<td><button class="del" data-g="del" aria-label="Delete row ${i+1}">×</button></td></tr>`}).join("")
    ||`<tr><td colspan="${cols.length+comp.length+2}" class="empty">${esc(ui.flagged?"No rows with exceptions.":"No rows yet. Paste from Excel, import a file, or add a row.")}</td></tr>`;
  return tools+`<div class="frame grid" data-grid="${key}"><table class="tbl edit" id="t-${key}"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${gridFoot(key,C,idx)}</tfoot></table></div>`;
}
// totals row: sums every numeric column over all rows in view (every page, not only this one)
function gridFoot(key,C,idx){
  const cols=COL[key](),comp=COMP[key],data=DATA[key]();if(!idx)idx=data.map((_,i)=>i);if(!idx.length)return "";
  const sum=f=>idx.reduce((s,i)=>{const v=f(i);return s+(v===""||v==null?0:num(v))},0);
  const skip=c=>/^Period|Days late|Months late/.test(c.h)||c.k==="p";
  const cells=cols.map((c,ci)=>c.t==="num"&&!skip(c)?`<td class="n" data-tc="${ci}">${fmt(sum(i=>getV(key,data[i],c.k)))}</td>`:`<td></td>`);
  const ccells=comp.map(c=>c.n&&!skip(c)?`<td class="n calc">${fmt(sum(i=>c.f(data[i],rowCalc(key,i,C))))}</td>`:`<td class="calc"></td>`);
  if(cells.length)cells[0]=cells[0]===`<td></td>`?`<td><b>${esc(L("Total","الإجمالي"))}</b> <span class="note">${fmtInt(idx.length)}</span></td>`:cells[0];
  return `<tr class="total"><td></td>${cells.join("")}${ccells.join("")}<td></td></tr>`}
function cellInput(c,v,ci){const st=c.w?` style="min-width:${c.w}px"`:"";
  if(c.t==="sel"){const opts=[...c.o];if(v&&!opts.includes(v))opts.push(v);return `<select data-k="${c.k}" data-ci="${ci}"${st}><option value=""></option>${opts.map(o=>`<option value="${esc(o)}"${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>`}
  if(c.t==="date")return `<input type="date" data-k="${c.k}" data-ci="${ci}" value="${esc(v)}"${st}>`;
  return `<input type="text" ${c.t==="num"?'inputmode="decimal" class="num"':""} data-k="${c.k}" data-ci="${ci}" value="${esc(v)}"${st}>`}
function compCell(c,row,x,j){const v=c.f(row,x);if(c.flags)return `<td class="calc flags" data-c="${j}">${esc(v)}</td>`;return `<td class="calc ${c.n?"n":""}" data-c="${j}">${c.n&&v!==""?fmt(v):esc(v)}</td>`}
function bindGrid(key){
  const wrap=document.querySelector(`[data-grid="${key}"]`);if(!wrap)return;const tb=wrap.querySelector("tbody"),cols=COL[key](),data=DATA[key];
  const upd=e=>{const el=e.target;if(!el.dataset.k)return;const tr=el.closest("tr"),i=+tr.dataset.i;setV(key,data()[i],el.dataset.k,el.value);S.example=false;save();
    const C=compute(),x=rowCalc(key,i,C);tr.querySelectorAll("[data-c]").forEach(td=>{const c=COMP[key][+td.dataset.c],v=c.f(data()[i],x);td.textContent=c.n&&v!==""?fmt(v):v});const tf=wrap.querySelector("tfoot");if(tf){const ui=UI[key];let idx=data().map((_,j)=>j);if(ui&&ui.flagged)idx=idx.filter(j=>{const y=rowCalc(key,j,C);return y&&y.flags&&y.flags.length});tf.innerHTML=gridFoot(key,C,idx)}renderNav(C);if(key==="tb")refreshTbCheck(C)};
  tb.addEventListener("input",upd);tb.addEventListener("change",upd);
  tb.addEventListener("paste",e=>{const el=e.target;if(!el.dataset||el.dataset.ci==null)return;const txt=(e.clipboardData||window.clipboardData).getData("text");if(!/[\t\n]/.test(txt.replace(/\s+$/,"")))return;e.preventDefault();
    const lines=txt.replace(/\r/g,"").replace(/\n+$/,"").split("\n").map(l=>l.split("\t"));const start=+el.closest("tr").dataset.i,ci=+el.dataset.ci;
    lines.forEach((cells,ri)=>{let row=data()[start+ri];if(!row){row=NEWROW[key]();data().push(row)}cells.forEach((v,k)=>{const c=cols[ci+k];if(c)setV(key,row,c.k,normCell(c,v))})});
    S.example=false;save();render();toast(`Pasted ${lines.length} row${lines.length>1?"s":""}`)});
  tb.addEventListener("click",e=>{const b=e.target.closest('[data-g="del"]');if(!b)return;data().splice(+b.closest("tr").dataset.i,1);save();render()});
  wrap.parentElement.querySelector(".toolbar").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;const ui=UI[key];
    if(b.dataset.g==="add"){data().push(NEWROW[key]());ui.flagged=false;ui.page=Math.floor((data().length-1)/PAGE);save();render();document.querySelector(`[data-grid="${key}"] tbody tr:last-child input`)?.focus()}
    if(b.dataset.g==="flag"){ui.flagged=!ui.flagged;ui.page=0;render()}
    if(b.dataset.g==="prev"){ui.page--;render()}if(b.dataset.g==="next"){ui.page++;render()}
    if(b.dataset.g==="copy")copyText(tableTSV(document.getElementById("t-"+key)));
    if(b.dataset.g==="clearall")confirmBox("Delete every row in this table?","Delete rows",()=>{data().length=0;save();render()});
    if(b.dataset.g==="import")pickFile(wb=>importTable(key,wb))});
}
function normCell(c,v){v=v==null?"":v;if(c.t==="date")return normDate(v);if(c.t==="sel")return normSel(v,c.o);if(c.t==="num"){if(v===""||v==null)return "";return String(Math.round(num(v)*100)/100)}return String(v).trim()}
function rowsInto(key,rows,colCount){const cols=COL[key]();let n=0;for(const r of rows){if(!r.slice(0,colCount).some(v=>String(v).trim()!==""))continue;const row=NEWROW[key]();cols.forEach((c,k)=>setV(key,row,c.k,normCell(c,r[k])));DATA[key]().push(row);n++}return n}
const SHEET_AR={Setup:"الإعدادات",Checklist:"قائمة_المستندات",TB_Monthly:"ميزان_المراجعة",VAT_Returns:"الإقرارات",Sales_Register:"سجل_المبيعات",Purchase_Register:"سجل_المشتريات",ZATCA_Payments:"المدفوعات"};

  const tmpl={tb:"TB_Monthly",sales:"Sales_Register",pur:"Purchase_Register",pay:"ZATCA_Payments"}[key];let rows,ws=wb.Sheets[tmpl]||wb.Sheets[SHEET_AR[tmpl]];

  else{rows=sheetRows(wb.Sheets[wb.SheetNames[0]]);const ni={tb:4,sales:7,pur:7,pay:3}[key];if(rows.length&&typeof rows[0][ni]==="string"&&rows[0][ni]!==""&&!/^[\d,.()\-\s]+$/.test(rows[0][ni]))rows=rows.slice(1)}

  const n=rowsInto(key,rows,COL[key]().length);S.example=false;save();render();toast(`Imported ${fmtInt(n)} rows`)}
function importWorkbook(wb){
  const sh=n=>wb.Sheets[n]||wb.Sheets[SHEET_AR[n]],has=n=>!!sh(n);
  if(!has("TB_Monthly")&&!has("Sales_Register")&&!has("VAT_Returns")){toast("This isn't the VAT Inspection Pack workbook. Use the Import button on each table instead.");return}
  const keep={setup:S.setup,case:S.case,requests:S.requests};S=exampleState();Object.assign(S,keep);S.example=false;S.tb=[];S.sales=[];S.purchases=[];S.payments=[];S.decisions={};S.vouch={};S.returns=Array.from({length:12},blankReturn);
  if(has("Setup")){const r=sheetRows(sh("Setup"));const g=i=>(r[i]||[])[1];const pc=v=>{const n=num(v);return String(n<=1?r2(n*100):n)};Object.assign(S.setup,{company:String(g(3)||""),vat:String(g(4)||""),cr:String(g(5)||""),fy:normDate(g(6))||"2025-01-01",freq:(g(7)==="Quarterly"||g(7)==="ربع سنوي")?"Quarterly":"Monthly",rate:pc(g(8)),tol:String(num(g(9))),asof:normDate(g(10))||S.setup.asof,lpp:pc(g(11)),irp:pc(g(12))})}
  if(has("TB_Monthly"))rowsInto("tb",sheetRows(sh("TB_Monthly")).slice(5).filter(r=>String(r[0]).trim()||String(r[1]).trim()),17);
  if(has("Sales_Register"))rowsInto("sales",sheetRows(sh("Sales_Register")).slice(5).map(dropTotal),13);
  if(has("Purchase_Register"))rowsInto("pur",sheetRows(sh("Purchase_Register")).slice(5).map(dropTotal),13);
  if(has("ZATCA_Payments"))rowsInto("pay",sheetRows(sh("ZATCA_Payments")).slice(5),5);
  if(has("VAT_Returns")){const rr=sheetRows(sh("VAT_Returns"));for(let i=0;i<12;i++){const r=rr[5+i]||[],t=S.returns[i];const sv=v=>v===""||v==null?"":String(num(v));t.filed=normDate(r[3]);t.ref=String(r[4]||"");BOX_IDS.forEach((b,k)=>{const c=5+3*k;t.b[b]={a:sv(r[c]),j:sv(r[c+1]),v:sv(r[c+2])}});t.b14=sv(r[35]);t.b15=sv(r[36]);t.b16=sv(r[37])}}
  if(has("Checklist")){const rr=sheetRows(sh("Checklist"));S.checklist.forEach((c,i)=>{const r=rr[4+i]||[];if(r[6])c.status=normSel(r[6],STATUS);c.owner=String(r[4]||"");c.ref=String(r[7]||"");c.notes=String(r[8]||"")})}
  save();render();toast("Workbook imported")}

 <tr class="total"><td>${esc("Year")}</td>${["ret","cl","df","rk","gl","d1","d2"].map(f=>nc(T(f))).join("")}<td></td>${nc(T("over"),T("over")>C.c.tol)}</tr></tbody></table></div><div class="row"><button class="btn sm" data-copy="t-in">${esc("Copy table")}</button></div>`)}
