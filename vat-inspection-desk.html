<style>
/* Layout: fixed left ledger-style navigation + working area; tables scroll inside their own frames. */
:root{
  --bg:#f5f7f5; --surface:#ffffff; --surface-2:#eef2ef; --line:#d7dfda; --fg:#18231d; --muted:#5b6b62;
  --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --ok:#1d7a46; --ok-bg:#dff3e6; --bad:#b4232a; --bad-bg:#fbe3e3; --warn:#8a5a00; --warn-bg:#fff1cf; --none:#7a8780; --none-bg:#eceff0;
  --input-bg:#fffdf2; --input-line:#e2d9a8;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1d2722; --line:#2c3a33; --fg:#e4ece7; --muted:#9aaba1;
  --accent:#4cc296; --accent-ink:#0b1410; --accent-soft:#1d3a2e;
  --ok:#5fd18f; --ok-bg:#173726; --bad:#ff7b7f; --bad-bg:#3d1c1e; --warn:#f2c14e; --warn-bg:#3a2f12; --none:#8d9a93; --none-bg:#232c28;
  --input-bg:#1c231c; --input-line:#3f4a33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1d2722; --line:#2c3a33; --fg:#e4ece7; --muted:#9aaba1;
  --accent:#4cc296; --accent-ink:#0b1410; --accent-soft:#1d3a2e;
  --ok:#5fd18f; --ok-bg:#173726; --bad:#ff7b7f; --bad-bg:#3d1c1e; --warn:#f2c14e; --warn-bg:#3a2f12; --none:#8d9a93; --none-bg:#232c28;
  --input-bg:#1c231c; --input-line:#3f4a33; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
nav.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font:600 19px/1.15 var(--f-display);color:var(--fg);margin:0 6px 4px}
.brand-ar{font:500 13px var(--f-ar);color:var(--muted);margin:0 6px 12px;direction:rtl;text-align:start}
.lang{margin:0 6px 8px}
html[lang="ar"] body{font-family:var(--f-ar)}
html[lang="ar"] h1,html[lang="ar"] .brand{font-family:var(--f-ar);font-weight:700}
html[lang="ar"] .ar,html[lang="ar"] .brand-ar{display:none}
html[lang="ar"] .nav-group,html[lang="ar"] thead th,html[lang="ar"] .kpi .lab{letter-spacing:0;text-transform:none}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px}
.nav-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;border:0;background:none;color:var(--fg);font:500 13.5px var(--f-body);padding:7px 10px;border-radius:6px;cursor:pointer}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.none{background:transparent}
main{padding-block:24px 64px;padding-inline:28px;min-width:0}
h1{font:600 28px/1.15 var(--f-display);margin:0 0 4px;text-wrap:balance}
h2{font:600 17px/1.3 var(--f-body);margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 18px;max-width:75ch}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.toolbar .spacer{flex:1}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--warn-bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 18px}
.banner b{color:var(--warn)}
.privacy{font-size:12px;color:var(--muted);margin:14px 6px 0;line-height:1.45}
.frame{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
thead th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--fg);position:sticky;top:0;z-index:1;white-space:nowrap}
th.n,td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{direction:ltr} .num{direction:ltr}
tr.total td{background:var(--surface-2);font-weight:600}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
td.calc{background:var(--surface-2)}
td.flags{color:var(--bad);font-size:12px;min-width:260px}
.grid input,.grid select,.form input{width:100%;min-width:90px;background:var(--input-bg);border:1px solid var(--input-line);color:var(--fg);border-radius:4px;padding:4px 6px;font:13px var(--f-body)}
.grid input.num,.form input.num{text-align:right;font-family:var(--f-num)}
.grid td{padding:3px 4px}
.grid td.rowno{color:var(--muted);font-size:11px;text-align:end;padding-inline-end:6px}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px}
.del:hover{color:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.none{background:var(--none-bg);color:var(--none)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lab{font-size:12px;color:var(--muted)}
.kpi .val{font:500 22px var(--f-num);font-variant-numeric:tabular-nums}
.kpi.hot{border-color:var(--bad)} .kpi.hot .val{color:var(--bad)}
.kpi.cool .val{color:var(--ok)}
.heat td.h{width:44px;min-width:44px;text-align:center;padding:5px 2px;cursor:pointer}
.heat .cell{display:block;height:22px;border-radius:4px;line-height:22px;font-size:12px;font-weight:700}
.cell.ok{background:var(--ok-bg);color:var(--ok)} .cell.bad{background:var(--bad-bg);color:var(--bad)} .cell.none{background:var(--none-bg);color:var(--none)}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--bad);border-radius:6px;padding:8px 12px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.issues li.ok{border-inline-start-color:var(--ok)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.setup-grid{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:8px 16px;align-items:center;max-width:820px}
.setup-grid label{font-weight:500}
.setup-grid .hint{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
.form input,.setup-grid input,.setup-grid select{background:var(--input-bg);border:1px solid var(--input-line);color:var(--fg);border-radius:4px;padding:6px 8px;font:13px var(--f-body);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;font:500 12.5px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-start:6px;vertical-align:middle}
.boxno{font:600 12px var(--f-num);color:var(--accent);white-space:nowrap}
.boxname{display:flex;flex-direction:column}
.boxname .ar{font-size:12px;color:var(--muted)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent)}
.guide h3{font:600 15px var(--f-body);margin:22px 0 6px;color:var(--accent)}
.guide ul{margin:0;padding-inline-start:20px;max-width:90ch} .guide li{margin:4px 0}
.guide dl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 16px;max-width:95ch;margin:0}
.guide dt{font-weight:600}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.modal-back{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:10px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.modal textarea{width:100%;height:180px;font:12px var(--f-num);background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.muted{color:var(--muted)} .small{font-size:12px}
.neg{color:var(--bad)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;border-inline-end:0;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:4px;overflow-x:auto;white-space:nowrap}
  .brand,.brand-ar,.nav-group,.privacy{display:none} .lang{margin:0;flex:none}
  .nav-btn{width:auto;flex:none}
  main{padding-inline:16px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .setup-grid{grid-template-columns:minmax(0,1fr)} .setup-grid .hint{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
// ---------------------------------------------------------------- constants
const SALES_CATS=["Standard 15% (Box 1)","Citizens - Healthcare/Education (Box 2)","Zero-rated domestic (Box 3)","Export (Box 4)","Exempt (Box 5)","Out of scope"];
const PUR_CATS=["Standard domestic 15% (Box 7)","Import - VAT paid at customs (Box 8)","Import - Reverse charge (Box 9)","Zero-rated purchase (Box 10)","Exempt purchase (Box 11)","Out of scope / Not reported"];
const OOS_MAP="Revenue - Out of scope / Other income";
const TB_MAPS=[...SALES_CATS.slice(0,5),OOS_MAP,"Output VAT","Input VAT","VAT Payable / Settlement","Not VAT relevant"];
const DOC_TYPES=["Tax Invoice","Simplified Tax Invoice","Credit Note","Debit Note"];
const CUST_TYPES=["B2B - VAT registered","B2B - Not registered","B2C - Individual","Government"];
const NATURE=["General business expense","Capital asset","Entertainment / hospitality (blocked)","Motor vehicle - private use (blocked)","Staff personal benefit (blocked)","Other non-business (blocked)"];
const YN=["Yes","No"], FS=["Asset","Liability","Equity","Revenue","Expense"], STATUS=["Not started","In progress","Ready","Submitted","N/A"];
const BOXES=[
 {b:1,en:"Standard rated sales (15%)",ar:"المبيعات الخاضعة للنسبة الأساسية"},
 {b:2,en:"Sales to citizens (private healthcare / education)",ar:"المبيعات للمواطنين (الخدمات الصحية والتعليم الأهلي)"},
 {b:3,en:"Zero-rated domestic sales",ar:"المبيعات المحلية الخاضعة للنسبة الصفرية"},
 {b:4,en:"Exports",ar:"الصادرات"},
 {b:5,en:"Exempt sales",ar:"المبيعات المعفاة"},
 {b:7,en:"Standard rated domestic purchases (15%)",ar:"المشتريات المحلية الخاضعة للنسبة الأساسية"},
 {b:8,en:"Imports subject to VAT paid at customs",ar:"الاستيرادات الخاضعة للضريبة المدفوعة في الجمارك"},
 {b:9,en:"Imports subject to VAT – reverse charge",ar:"الاستيرادات الخاضعة لآلية الاحتساب العكسي"},
 {b:10,en:"Zero-rated purchases",ar:"المشتريات الخاضعة للنسبة الصفرية"},
 {b:11,en:"Exempt purchases",ar:"المشتريات المعفاة"}];
const BOX_IDS=BOXES.map(x=>x.b);
const CHECKLIST=[
["General","VAT registration certificate, Commercial Registration, Articles of Association"],
["General","Description of business activities and revenue streams, with the VAT treatment of each"],
["General","List of branches, related parties and VAT group members"],
["General","Chart of accounts with VAT mapping","Trial balance"],
["General","ERP and e-invoicing (FATOORA) solution details, onboarding and CSID"],
["General","Authorisation letter for the representative dealing with ZATCA"],
["Financial","Audited financial statements for each year under review"],
["Financial","Monthly trial balances (opening, movements, closing)","Trial balance"],
["Financial","General ledger detail for revenue, VAT and major expense accounts"],
["Financial","Bank statements (ZATCA compares receipts with declared sales)"],
["VAT returns","Copies of all filed VAT returns and SADAD payment receipts","VAT returns, Payments"],
["VAT returns","Voluntary disclosures and corrections filed (Box 14 usage)","VAT returns"],
["Reconciliation","Revenue per financial statements vs total sales per VAT returns","Revenue reconciliation"],
["Reconciliation","Sales per VAT box vs sales listing vs GL, by period","Sales reconciliation"],
["Reconciliation","Output VAT per GL vs returns","Output VAT reconciliation"],
["Reconciliation","Input VAT per GL vs returns","Input VAT reconciliation"],
["Reconciliation","VAT payable account roll-forward","VAT account reconciliation"],
["Reconciliation","Customs import data (Bayan) vs Box 8","Input VAT reconciliation"],
["Sales","Sales listing at invoice level with customer VAT numbers","Sales register"],
["Sales","Sample tax invoices, simplified invoices, credit and debit notes (XML / QR)"],
["Sales","Export evidence: customs exit declarations, bills of lading, contracts, payment proof","Sales register"],
["Sales","Zero-rated domestic supply evidence (qualifying medicines, international transport, etc.)","Sales register"],
["Sales","Exempt supplies support (financial services margin, residential leases)"],
["Sales","Major customer contracts, including government contracts and VAT clauses"],
["Sales","Deemed supplies: free samples, gifts, own use, staff benefits, write-offs"],
["Sales","Related-party and intercompany charges and their VAT treatment"],
["Sales","Fixed asset and real estate disposals (VAT / RETT treatment)"],
["Purchases","Purchase listing at invoice level with supplier VAT numbers","Purchase register"],
["Purchases","Sample supplier tax invoices supporting input VAT claimed","Purchase register"],
["Purchases","Import customs declarations (Bayan) and proof of customs VAT paid","Purchase register"],
["Purchases","Reverse charge: foreign supplier invoices, contracts, RCM calculation","Purchase register"],
["Purchases","Blocked input VAT analysis (entertainment, vehicles, staff benefits)","Purchase register"],
["Purchases","Fixed asset register and capital asset adjustments"],
["Purchases","Input VAT apportionment calculation (if any exempt supplies)"],
["Cross-tax","Withholding tax returns (foreign payments should match Box 9)"],
["Cross-tax","Zakat / income tax return revenue vs VAT revenue"],
["E-invoicing","Phase 2 integration wave and cleared / reported invoices report","Sales register"],
["Response","Written explanation for every difference found","Reconciliations"]];

// ---------------------------------------------------------------- state
const KEY="vat-inspection-desk-v1";
function blankReturn(){const b={};BOX_IDS.forEach(x=>b[x]={a:"",j:"",v:""});return{filed:"",ref:"",b,b14:"",b15:"",b16:""}}
function exampleState(){
  const s={example:true,setup:{company:"Example Trading Company",vat:"300000000000003",cr:"1010000000",fy:"2025-01-01",freq:"Monthly",rate:"15",tol:"10",asof:"2026-10-04",lpp:"5",irp:"50"},
  tb:[],returns:Array.from({length:12},blankReturn),sales:[],purchases:[],payments:[],
  checklist:CHECKLIST.map(()=>({status:"Not started",owner:"",ref:"",notes:""})),recItems:[{d:"Timing – invoices booked in a different period",a:""},{d:"Revenue accruals not yet invoiced",a:""},{d:"Advance payments invoiced",a:""},{d:"Other",a:""}]};
  const tb=(code,name,fs,map,open,mv)=>{const m=Array(12).fill("");Object.entries(mv).forEach(([k,v])=>m[k-1]=String(v));return{code,name,fs,map,open:String(open),m}};
  s.tb=[tb("1100","Cash at Bank","Asset","Not VAT relevant",500000,{1:81000,2:-9000}),
    tb("2210","Output VAT","Liability","Output VAT",0,{1:-16500}),
    tb("2220","Input VAT","Asset","Input VAT",0,{1:7500}),
    tb("2230","VAT Payable – Settlement with ZATCA","Liability","VAT Payable / Settlement",0,{2:9000}),
    tb("3100","Share Capital / Retained Earnings","Equity","Not VAT relevant",-500000,{}),
    tb("4100","Sales – Local","Revenue",SALES_CATS[0],0,{1:-100000}),
    tb("4200","Sales – Export","Revenue",SALES_CATS[3],0,{1:-20000}),
    tb("4900","Other Income – Dividends","Revenue",OOS_MAP,0,{1:-2000}),
    tb("5100","Cost of Goods Purchased","Expense","Not VAT relevant",0,{1:40000}),
    tb("6100","Consulting Fees – Foreign","Expense","Not VAT relevant",0,{1:10000})];
  const r=s.returns[0]; r.filed="2025-02-25"; r.ref="VAT-2025-01";
  r.b[1]={a:"100000",j:"",v:"15000"}; r.b[4]={a:"20000",j:"",v:"0"}; r.b[7]={a:"40000",j:"",v:"6000"}; r.b[9]={a:"10000",j:"",v:"1500"}; r.b16="9000";
  s.sales=[{date:"2025-01-15",no:"INV-0001",type:"Tax Invoice",cust:"ABC Trading Co",cvat:"310123456700003",ctype:CUST_TYPES[0],cat:SALES_CATS[0],net:"100000",vat:"15000",uuid:"e3b0c442-98fc-1c14",fat:"Yes",gl:"4100",ev:""},
    {date:"2025-01-20",no:"INV-0002",type:"Tax Invoice",cust:"Gulf Imports LLC (UAE)",cvat:"",ctype:CUST_TYPES[1],cat:SALES_CATS[3],net:"20000",vat:"0",uuid:"a1f2c3d4-55aa-77bb",fat:"Yes",gl:"4200",ev:"Customs exit 123456 + B/L GLF-889"}];
  s.purchases=[{date:"2025-01-10",no:"SUP-778",sup:"Al Noor Supplies",svat:"310123456700003",country:"Saudi Arabia",cat:PUR_CATS[0],nature:NATURE[0],net:"40000",vat:"6000",valid:"Yes",claimed:"Yes",bayan:"",gl:"5100"},
    {date:"2025-01-25",no:"FX-2025-01",sup:"Global Consulting Ltd",svat:"",country:"United Kingdom",cat:PUR_CATS[2],nature:NATURE[0],net:"10000",vat:"1500",valid:"Yes",claimed:"Yes",bayan:"",gl:"6100"}];
  s.payments=[{p:"1",date:"2025-02-27",ref:"SADAD-90012345",amt:"9000",notes:"Jan 2025 VAT"}];
  return s;
}
let S;
try{const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):exampleState();}catch(e){S=exampleState();}
if(!S.returns||S.returns.length!==12)S=exampleState();
let saveTimer=null, saveWarned=false;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){if(!saveWarned){saveWarned=true;toast("This data is too large to keep in the browser. It stays here until you close the page.");}}},400)}

// ---------------------------------------------------------------- helpers
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function num(v){if(typeof v==="number")return isFinite(v)?v:0;if(v==null)return 0;let s=String(v).trim().replace(/[,\s]|SAR|ر\.س/gi,"");if(!s)return 0;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}const n=parseFloat(s);return isFinite(n)?(neg?-n:n):0}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function fmt(n){n=r2(n||0);if(Math.abs(n)<0.005)return "–";const s=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?`(${s})`:s}
const fmtInt=n=>(n||0).toLocaleString("en-US");
const pad=n=>String(n).padStart(2,"0");
function iso(d){return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
function D(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}
function addM(d,n){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1))}
function eom(d){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0))}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const showDate=s=>{const d=D(s);return d?`${pad(d.getUTCDate())} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`:""};
function normDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==="number"&&v>20000&&v<80000){return iso(new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5))}
  const s=String(v).trim();let m;
  if((m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(s)))return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if((m=/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s](\d{4})/.exec(s))){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)return `${m[3]}-${pad(i+1)}-${pad(m[1])}`}
  if(/^\d{5}$/.test(s))return normDate(+s);
  return s;
}

function normCell(c,v){v=v==null?"":v;if(c.t==="date")return normDate(v);if(c.t==="sel")return normSel(v,c.o);if(c.t==="num"){if(v===""||v==null)return "";return String(num(v))}return String(v).trim()}
function rowsInto(key,rows,colCount){const cols=COL[key]();let n=0;for(const r of rows){if(!r.slice(0,colCount).some(v=>String(v).trim()!==""))continue;const row=NEWROW[key]();cols.forEach((c,k)=>setV(key,row,c.k,normCell(c,r[k])));DATA[key]().push(row);n++}return n}
function importTable(key,wb,rerender){
  const tmpl={tb:"TB_Monthly",sales:"Sales_Register",pur:"Purchase_Register",pay:"ZATCA_Payments"}[key];
  let rows, ws=wb.Sheets[tmpl]||wb.Sheets[SHEET_AR[tmpl]];

  if(key==="tb")rows=rows.filter(r=>String(r[0]).trim()!==""||String(r[1]).trim()!=="");
  const n=rowsInto(key,rows,COL[key]().length);S.example=false;save();rerender();toast(`Imported ${fmtInt(n)} rows`);

function importWorkbook(wb){
  const sh=n=>wb.Sheets[n]||wb.Sheets[SHEET_AR[n]];const has=n=>!!sh(n);
  if(!has("TB_Monthly")&&!has("Sales_Register")&&!has("VAT_Returns")){toast("This isn't the VAT Inspection Pack workbook. Use the Import button on each table instead.");return}
  const keepSetup=S.setup; S=exampleState(); S.example=false; S.tb=[];S.sales=[];S.purchases=[];S.payments=[];S.returns=Array.from({length:12},blankReturn); S.setup=keepSetup;
  if(has("Setup")){const r=sheetRows(sh("Setup"));const g=i=>(r[i]||[])[1];S.setup={company:String(g(3)||""),vat:String(g(4)||""),cr:String(g(5)||""),fy:normDate(g(6))||"2025-01-01",freq:(g(7)==="Quarterly"||g(7)==="ربع سنوي")?"Quarterly":"Monthly",rate:String(num(g(8))<1?num(g(8))*100:num(g(8))),tol:String(num(g(9))),asof:normDate(g(10))||S.setup.asof,lpp:String(num(g(11))<1?num(g(11))*100:num(g(11))),irp:String(num(g(12))<=1?num(g(12))*100:num(g(12)))}}
  if(has("TB_Monthly"))rowsInto("tb",sheetRows(sh("TB_Monthly")).slice(5).filter(r=>String(r[0]).trim()||String(r[1]).trim()),17);
  if(has("Sales_Register"))rowsInto("sales",sheetRows(sh("Sales_Register")).slice(5).map(dropTotal),13);
  if(has("Purchase_Register"))rowsInto("pur",sheetRows(sh("Purchase_Register")).slice(5).map(dropTotal),13);

  if(has("VAT_Returns")){const rr=sheetRows(sh("VAT_Returns"));for(let i=0;i<12;i++){const r=rr[5+i]||[];const t=S.returns[i];t.filed=normDate(r[3]);t.ref=String(r[4]||"");BOX_IDS.forEach((b,k)=>{const c=5+3*k;t.b[b]={a:r[c]===""?"":String(num(r[c])),j:r[c+1]===""?"":String(num(r[c+1])),v:r[c+2]===""?"":String(num(r[c+2]))}});t.b14=r[35]===""?"":String(num(r[35]));t.b15=r[36]===""?"":String(num(r[36]));t.b16=r[37]===""?"":String(num(r[37]))}}
  if(has("Checklist")){const rr=sheetRows(sh("Checklist"));S.checklist.forEach((c,i)=>{const r=rr[4+i]||[];if(r[6])c.status=normSel(r[6],STATUS);c.owner=String(r[4]||"");c.ref=String(r[7]||"");c.notes=String(r[8]||"")})}
  save();render();toast("Workbook imported");
}

 <tr class="total"><td>Year</td>${nc(t.ret)}${nc(t.reg)}${nc(t.tb)}${dc(t.ret-t.reg,C.c.tol)}${dc(t.ret-t.tb,C.c.tol)}<td></td></tr></tbody></table></div>`}).join("");

R.rrev=C=>{const v=C.rev;return `<h1>Revenue vs VAT returns</h1><p class="sub">Revenue in the financial statements against total sales declared for the year. ZATCA treats any unexplained excess as undeclared taxable sales.</p>
 <div class="frame"><table id="t-rev"><tbody>
 <tr><td>Total revenue per trial balance (FS class = Revenue)</td>${nc(v.tbRev)}</tr>
 <tr><td>Less: revenue mapped as out of scope / other income</td>${nc(-v.oos)}</tr>
 <tr class="total"><td>Revenue subject to VAT reporting</td>${nc(v.subj)}</tr>
 <tr><td>Total sales per VAT returns (Box 6, full year)</td>${nc(v.retSales)}</tr>
 <tr class="total"><td>Difference before reconciling items</td>${dc(v.rdiff,C.c.tol)}</tr></tbody></table></div>
 <h2>Explained reconciling items</h2><p class="small muted" style="margin-top:-4px">Enter each item with the sign that reduces the difference.</p>
 <div class="frame"><table><thead><tr><th>Description</th><th class="n">Amount (SAR)</th><th></th></tr></thead><tbody id="recitems">
 ${S.recItems.map((x,i)=>`<tr><td><input class="ri" data-i="${i}" data-f="d" value="${esc(x.d)}" style="width:100%;min-width:220px;background:var(--input-bg);border:1px solid var(--input-line);color:var(--fg);border-radius:4px;padding:5px 7px"></td><td><input class="ri num" data-i="${i}" data-f="a" inputmode="decimal" value="${esc(x.a)}" style="width:140px;text-align:right;background:var(--input-bg);border:1px solid var(--input-line);color:var(--fg);border-radius:4px;padding:5px 7px;font-family:var(--f-num)"></td><td><button class="del" data-ri="${i}" aria-label="Delete item">×</button></td></tr>`).join("")}
 </tbody></table></div><div class="toolbar" style="margin-top:8px"><button class="btn sm" id="addri">Add item</button></div>
 <div class="kpis" style="margin-top:14px">${kpi("Unexplained difference",`<span id="unexpl">${fmt(v.unexpl)}</span>`,Math.abs(v.unexpl)>C.c.tol?"hot":"cool",Math.abs(v.unexpl)>C.c.tol?"Explain or correct before submitting":"Fully reconciled")}</div>`};
AFTER.rrev=()=>{document.querySelectorAll(".ri").forEach(el=>el.addEventListener("input",()=>{S.recItems[+el.dataset.i][el.dataset.f]=el.value;save();const C=compute();$("#unexpl").textContent=fmt(C.rev.unexpl);renderNav(C)}));
 document.querySelectorAll("[data-ri]").forEach(b=>b.onclick=()=>{S.recItems.splice(+b.dataset.ri,1);save();render()});$("#addri").onclick=()=>{S.recItems.push({d:"",a:""});save();render()}};

R.rout=C=>{const T=f=>C.outRec.reduce((s,x)=>s+x[f],0);return `<h1>Output VAT</h1><p class="sub">Output VAT declared against invoices, the ledger and a 15% recomputation. Box 2 VAT is borne by the State and is left out of the recomputation.</p>
 <div class="toolbar"><button class="btn sm" data-copy="t-out">Copy table</button></div><div class="frame"><table id="t-out"><thead><tr><th>Period</th><th class="n">Return (incl. RCM)</th><th class="n">Register sales VAT</th><th class="n">Register RCM VAT</th><th class="n">15% × (Box 1 + Box 9)</th><th class="n">GL output VAT</th><th class="n">Return − register</th><th class="n">Return − 15%</th><th class="n">Return − GL</th><th>Status</th><th class="n">Possible under-declaration</th></tr></thead><tbody>
 ${C.outRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.ret)}${nc(r.rs)}${nc(r.rr)}${nc(r.rc)}${nc(r.gl)}${dc(r.d1,C.c.tol)}${dc(r.d2,C.c.tol)}${dc(r.d3,C.c.tol)}<td>${sp(r.s)}</td>${nc(r.under,r.under>C.c.tol)}</tr>`).join("")}
 <tr class="total"><td>Year</td>${["ret","rs","rr","rc","gl","d1","d2","d3"].map(f=>nc(T(f))).join("")}<td></td>${nc(T("under"),T("under")>C.c.tol)}</tr></tbody></table></div>`};

R.rin=C=>{const T=f=>C.inRec.reduce((s,x)=>s+x[f],0);return `<h1>Input VAT</h1><p class="sub">Input VAT claimed against the register and the ledger, and the part ZATCA is likely to disallow (no valid invoice, blocked expense, invalid supplier VAT number).</p>
 <div class="toolbar"><button class="btn sm" data-copy="t-in">Copy table</button></div><div class="frame"><table id="t-in"><thead><tr><th>Period</th><th class="n">Return (Box 12)</th><th class="n">Register claimed</th><th class="n">Defensible</th><th class="n">At risk</th><th class="n">GL input VAT</th><th class="n">Return − register</th><th class="n">Return − GL</th><th>Status</th><th class="n">Possible over-claim</th></tr></thead><tbody>
 ${C.inRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.ret)}${nc(r.cl)}${nc(r.df)}${nc(r.rk,r.rk>0)}${nc(r.gl)}${dc(r.d1,C.c.tol)}${dc(r.d2,C.c.tol)}<td>${sp(r.s)}</td>${nc(r.over,r.over>C.c.tol)}</tr>`).join("")}
 <tr class="total"><td>Year</td>${["ret","cl","df","rk","gl","d1","d2"].map(f=>nc(T(f))).join("")}<td></td>${nc(T("over"),T("over")>C.c.tol)}</tr></tbody></table></div>
 <h2>Imports: Box 8 and Box 9</h2><div class="toolbar"><button class="btn sm" data-copy="t-imp">Copy table</button></div><div class="frame"><table id="t-imp"><thead><tr><th>Period</th><th class="n">Box 8 VAT (return)</th><th class="n">Customs VAT (register)</th><th class="n">Difference</th><th class="n">Box 9 VAT (return)</th><th class="n">RCM VAT (register)</th><th class="n">Difference</th></tr></thead><tbody>
 ${C.inRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.b8)}${nc(r.c8)}${dc(r.d8,C.c.tol)}${nc(r.b9)}${nc(r.c9)}${dc(r.d9,C.c.tol)}</tr>`).join("")}
 <tr class="total"><td>Year</td>${["b8","c8","d8","b9","c9","d9"].map(f=>nc(T(f))).join("")}</tr></tbody></table></div>
 <p class="small muted">Also match Box 8 to ZATCA's customs import data. Customs VAT is deductible only when your company is the importer of record on the Bayan.</p>`};

R.rvat=C=>{const T=f=>C.vatRec.reduce((s,x)=>s+x[f],0);return `<h1>VAT account & penalties</h1><p class="sub">Proves the ledger VAT liability equals returns filed less payments made, and estimates late-payment penalties up to ${showDate(S.setup.asof)}.</p>
 <p>Opening VAT liability per ledger: <strong style="font-family:var(--f-num)">${fmt(C.openLiab)}</strong></p>
 <div class="toolbar"><button class="btn sm" data-copy="t-vat">Copy table</button></div><div class="frame"><table id="t-vat"><thead><tr><th>Period</th><th class="n">Net VAT (Box 13 + 14)</th><th class="n">Box 16 filed</th><th class="n">Paid / (refunded)</th><th class="n">Outstanding</th><th>Due</th><th>Filed</th><th class="n">Penalty: paid late</th><th class="n">Penalty: still unpaid</th><th class="n">GL liability</th><th class="n">Expected liability</th><th class="n">Difference</th><th>Status</th></tr></thead><tbody>
 ${C.vatRec.map(r=>`<tr><td>${esc(r.p.label)}</td>${nc(r.net)}${nc(r.b16)}${nc(r.paid)}${nc(r.outst,r.outst>C.c.tol)}<td>${showDate(iso(r.p.due))}</td><td>${r.late==="ok"?pill("ok","✓"):r.late==="bad"?pill("bad",`✗ ${r.lateDays}d late`):pill("none","—")}</td>${nc(r.latePen,r.latePen>0)}${nc(r.unpaidPen,r.unpaidPen>0)}${nc(r.gl)}${nc(r.exp)}${dc(r.diff,C.c.tol)}<td>${r.s==="ok"?pill("ok","✓ Agrees"):r.s==="bad"?pill("bad","✗ Investigate"):pill("none","No activity")}</td></tr>`).join("")}
 <tr class="total"><td>Year</td>${["net","b16","paid","outst"].map(f=>nc(T(f))).join("")}<td></td><td></td>${nc(T("latePen"))}${nc(T("unpaidPen"))}<td colspan="4"></td></tr></tbody></table></div>
 <p class="small muted">Expected liability = opening liability + cumulative (Box 13 + Box 14) − payments dated on or before period end. Late filing (5% to 25% of the tax) and incorrect return (50% of the difference) penalties may also apply.</p>`};

R.chk=C=>`<h1>Document checklist</h1><p class="sub">What ZATCA usually asks for in a VAT inspection. Track who owns each item and where the file is.</p>

 ${CHECKLIST.map((c,i)=>{const x=S.checklist[i];return `<tr><td class="rowno">${i+1}</td><td><strong>${esc(c[0])}</strong></td><td style="min-width:300px">${esc(c[1])}</td><td class="small muted">${esc(c[2]||"")}</td><td><select data-ck="${i}" data-f="status" style="min-width:120px">${STATUS.map(s=>`<option value="${s}"${s===x.status?" selected":""}>${s}</option>`).join("")}</select></td><td><input data-ck="${i}" data-f="owner" value="${esc(x.owner)}"></td><td><input data-ck="${i}" data-f="ref" value="${esc(x.ref)}" style="min-width:150px"></td><td><input data-ck="${i}" data-f="notes" value="${esc(x.notes)}" style="min-width:180px"></td></tr>`}).join("")}

AFTER.chk=()=>{document.querySelectorAll("[data-ck]").forEach(el=>{const h=()=>{S.checklist[+el.dataset.ck][el.dataset.f]=el.value;save();const C=compute();$("#rdy").textContent=Math.round(C.ready*100)+"% ready";document.querySelector(".bar>span").style.width=Math.round(C.ready*100)+"%"};el.addEventListener("input",h);el.addEventListener("change",h)})};

R.guide=()=>`<div class="guide"><h1>Inspection guide</h1><p class="sub">A summary of the KSA VAT Law and Implementing Regulations. Confirm current rates, penalties and deadlines with ZATCA or your advisor before relying on them.</p>
 <h3>How to use this app</h3><ul>
 <li>Set the company, the year under inspection and the filing frequency in <em>Company & period</em>.</li>
 <li>Paste or import the monthly trial balance and give every account a VAT mapping.</li>
 <li>Enter each filed VAT return box by box, with the filing date.</li>
 <li>Paste the sales and purchase listings from your ERP or FATOORA export, then the SADAD payments.</li>
 <li>Work through every ✗ on the reconciliation pages and write an explanation for each difference.</li>
 <li>Use <em>Copy table</em> on any page to paste the result into Excel for your submission file.</li></ul>
 <h3>What ZATCA typically tests</h3><ul>
 <li>Revenue in the audited financial statements and Zakat return against total sales in the VAT returns.</li>
 <li>Bank receipts against declared sales; customs import data against Box 8; withholding tax returns against Box 9.</li>
 <li>Proof for zero-rated and export sales: customs exit, bills of lading, contracts.</li>
 <li>Input VAT: a valid tax invoice in your company's name from a supplier with a valid VAT number, and no blocked items.</li>
 <li>Credit notes: a valid reason, correctly issued, linked to the original invoice.</li>
 <li>Deemed supplies: gifts, samples, own use, staff benefits, asset write-offs.</li>
 <li>E-invoicing: invoices generated, cleared or reported through a compliant solution with the required fields and QR code.</li>
 <li>Timely filing and payment, and use of Box 14 above the SAR 5,000 limit.</li></ul>
 <h3>Common findings</h3><ul>
 <li>Revenue booked in the ledger but not declared: accruals, other income, recharges, asset sales.</li>
 <li>Exports zero-rated without exit evidence, reassessed at 15%.</li>
 <li>Input VAT claimed on invoices with no supplier VAT number, in another entity's name, or on simplified invoices.</li>
 <li>Reverse charge not applied to foreign services such as consulting, software, royalties and management fees.</li>
 <li>Customs VAT claimed when the company was not the importer of record.</li>
 <li>Blocked input VAT claimed: entertainment, hospitality, private-use vehicles, staff personal benefits.</li>
 <li>Errors above SAR 5,000 corrected in Box 14 instead of through a voluntary disclosure.</li></ul>
 <h3>Key rules and penalties</h3><dl>
 <dt>Filing</dt><dd>Monthly when taxable supplies exceed SAR 40 million a year, otherwise quarterly. Return and payment are due by the last day of the following month.</dd>
 <dt>Late filing</dt><dd>5% to 25% of the tax due (Art. 43).</dd>
 <dt>Late payment</dt><dd>5% of the unpaid tax for each month or part of a month (Art. 43).</dd>
 <dt>Incorrect return</dt><dd>50% of the difference between the tax calculated and the tax due (Art. 42).</dd>
 <dt>Tax evasion</dt><dd>Up to three times the value of the goods or services concerned (Art. 40).</dd>
 <dt>Corrections</dt><dd>Net errors above SAR 5,000 need a voluntary disclosure, within 20 days of discovery. Smaller errors can go in Box 14 of the next return.</dd>
 <dt>Records</dt><dd>Keep records for at least 6 years, 11 years for capital assets and 15 years for real estate.</dd>
 <dt>Assessment window</dt><dd>Generally 5 years from the end of the tax period; 10 years where no return was filed or in cases of evasion.</dd>
 <dt>Objection</dt><dd>Object to an assessment within the statutory deadline (currently 60 days from notification; verify), then escalate to the GSTC committees if needed.</dd>
 <dt>Relief</dt><dd>Check whether a ZATCA penalty waiver initiative is active. These have been extended several times.</dd></dl>
 <h3>Responding to ZATCA</h3><ul>
 <li>Answer what is requested, in writing, within the deadline in the notice. Ask for an extension in writing if you need one.</li>
 <li>Don't submit a reconciliation with unexplained differences. Fix or explain every ✗ first.</li>
 <li>Keep one index of everything you submit and the date it was sent (the checklist's file reference column).</li>
 <li>If you find an error before ZATCA does, assess whether a voluntary disclosure reduces the penalty.</li>
 <li>Have your tax advisor review the pack before it goes out.</li></ul></div>`;

R.guideAr=()=>`<div class="guide"><h1>دليل الفحص</h1><p class="sub">ملخص لنظام ضريبة القيمة المضافة ولائحته التنفيذية في المملكة. تأكد من النسب والغرامات والمواعيد الحالية مع الهيئة أو مستشارك قبل الاعتماد عليها.</p>
 <h3>طريقة استخدام التطبيق</h3><ul>
 <li>حدد المنشأة والسنة محل الفحص ودورية الإقرار في صفحة <em>المنشأة والفترة</em>.</li>
 <li>الصق أو استورد ميزان المراجعة الشهري، وحدد تصنيفاً ضريبياً لكل حساب.</li>
 <li>أدخل كل إقرار مقدم خانةً خانة مع تاريخ التقديم.</li>
 <li>الصق سجلات المبيعات والمشتريات من نظام ERP أو من فاتورة، ثم مدفوعات سداد.</li>
 <li>عالج كل علامة ✗ في صفحات المطابقة، واكتب تفسيراً لكل فرق.</li>
 <li>استخدم <em>نسخ الجدول</em> في أي صفحة للصق النتيجة في Excel ضمن ملف الرد على الهيئة.</li></ul>
 <h3>ما تفحصه الهيئة عادةً</h3><ul>
 <li>الإيرادات في القوائم المالية المدققة وإقرار الزكاة مقابل إجمالي المبيعات في الإقرارات الضريبية.</li>
 <li>المتحصلات البنكية مقابل المبيعات المُقر بها، وبيانات الاستيراد الجمركية مقابل خانة 8، وإقرارات ضريبة الاستقطاع مقابل خانة 9.</li>
 <li>إثباتات المبيعات بنسبة صفر والصادرات: بيانات الخروج الجمركية وبوالص الشحن والعقود.</li>
 <li>ضريبة المدخلات: فاتورة ضريبية صحيحة باسم منشأتك من مورد برقم ضريبي صحيح، ودون بنود غير قابلة للخصم.</li>
 <li>الإشعارات الدائنة: سبب صحيح، وإصدار سليم، وربط بالفاتورة الأصلية.</li>
 <li>التوريدات الافتراضية: الهدايا والعينات والاستخدام الخاص ومنافع الموظفين وشطب الأصول.</li>
 <li>الفوترة الإلكترونية: إصدار الفواتير واعتمادها أو الإبلاغ عنها عبر حل متوافق يتضمن الحقول المطلوبة ورمز QR.</li>
 <li>الالتزام بمواعيد التقديم والسداد، واستخدام خانة 14 بما يتجاوز حد 5,000 ريال.</li></ul>
 <h3>الملاحظات الشائعة</h3><ul>
 <li>إيرادات مسجلة في الدفاتر وغير مُقر بها: إيرادات مستحقة، إيرادات أخرى، إعادة تحميل تكاليف، بيع أصول.</li>
 <li>صادرات بنسبة صفر دون إثبات خروج، فيُعاد تقييمها بنسبة 15%.</li>
 <li>خصم ضريبة مدخلات على فواتير دون رقم ضريبي للمورد، أو باسم منشأة أخرى، أو على فواتير مبسطة.</li>
 <li>عدم تطبيق الاحتساب العكسي على الخدمات الأجنبية مثل الاستشارات والبرمجيات والإتاوات وأتعاب الإدارة.</li>
 <li>خصم ضريبة الجمارك رغم أن المنشأة ليست المستورد المسجل.</li>
 <li>خصم ضريبة غير قابلة للخصم: الترفيه والضيافة والسيارات للاستخدام الشخصي ومنافع الموظفين الشخصية.</li>
 <li>تصحيح أخطاء تتجاوز 5,000 ريال عبر خانة 14 بدلاً من الإفصاح الطوعي.</li></ul>
 <h3>الأحكام والغرامات الرئيسية</h3><dl>
 <dt>تقديم الإقرار</dt><dd>شهرياً إذا تجاوزت التوريدات الخاضعة 40 مليون ريال سنوياً، وإلا ربع سنوي. يستحق الإقرار والسداد في آخر يوم من الشهر التالي لنهاية الفترة.</dd>
 <dt>التأخر في التقديم</dt><dd>من 5% إلى 25% من الضريبة المستحقة (المادة 43).</dd>
 <dt>التأخر في السداد</dt><dd>5% من الضريبة غير المسددة عن كل شهر أو جزء منه (المادة 43).</dd>
 <dt>الإقرار الخاطئ</dt><dd>50% من قيمة الفرق بين الضريبة المحتسبة والضريبة المستحقة (المادة 42).</dd>
 <dt>التهرب الضريبي</dt><dd>حتى ثلاثة أضعاف قيمة السلع أو الخدمات محل التهرب (المادة 40).</dd>
 <dt>التصحيحات</dt><dd>الأخطاء التي يتجاوز صافيها 5,000 ريال تتطلب إفصاحاً طوعياً خلال 20 يوماً من اكتشافها. الأخطاء الأصغر يمكن تصحيحها في خانة 14 من الإقرار التالي.</dd>
 <dt>حفظ السجلات</dt><dd>6 سنوات على الأقل، و11 سنة للأصول الرأسمالية، و15 سنة للعقارات.</dd>
 <dt>مدة التقادم</dt><dd>عادةً 5 سنوات من نهاية الفترة الضريبية، و10 سنوات في حال عدم تقديم الإقرار أو التهرب.</dd>
 <dt>الاعتراض</dt><dd>قدّم الاعتراض على التقييم خلال المهلة النظامية (حالياً 60 يوماً من الإبلاغ، تحقق منها)، ثم التصعيد إلى لجان الفصل في المخالفات والمنازعات الضريبية عند الحاجة.</dd>
 <dt>الإعفاء من الغرامات</dt><dd>تحقق مما إذا كانت مبادرة الإعفاء من الغرامات سارية حالياً، فقد مُددت عدة مرات.</dd></dl>
 <h3>الرد على الهيئة</h3><ul>
 <li>أجب عما هو مطلوب كتابةً وخلال المهلة المحددة في الإشعار. اطلب التمديد كتابةً عند الحاجة.</li>
 <li>لا تقدّم مطابقة بها فروق غير مفسرة. عالج أو فسّر كل علامة ✗ أولاً.</li>
 <li>احتفظ بفهرس واحد لكل ما تقدمه وتاريخ إرساله (عمود مرجع الملف في قائمة المستندات).</li>
 <li>إذا اكتشفت خطأً قبل الهيئة، فادرس ما إذا كان الإفصاح الطوعي يخفض الغرامة.</li>
 <li>اطلب من مستشارك الضريبي مراجعة الملف قبل إرساله.</li></ul></div>`;
